let calOffset=0,calTab=0,calYear=null;
function monthAt(off){const t=GeezCal.fromJdn(GeezCal.today());const idx=t.y*13+(t.m-1)+off;return [Math.floor(idx/13),idx%13+1]}
function gspan(y,m){const C=GeezCal,a=C.toG(C.ethJdn(y,m,1)),b=C.toG(C.ethJdn(y,m,C.dim(y,m))),n=d=>C.GM[d.m-1].slice(0,3);return a.y===b.y?`${n(a)} ${a.d} – ${n(b)} ${b.d}, ${b.y}`:`${n(a)} ${a.d}, ${a.y} – ${n(b)} ${b.d}, ${b.y}`}
function evRow(j,e,countdown){const C=GeezCal,E=C.fromJdn(j),g=C.toG(j),b=document.createElement('button');b.className='ev'+(countdown&&j<C.today()?' past':'');
  b.innerHTML=`<span class="d"><b style="color:${e.type==='major'?'var(--rubric)':e.type==='feast'?'#B8860B':e.type==='fast'?'#7E57C2':'#3E8E6E'}">${E.d}</b><small>${C.R.months[E.m-1]}</small></span><span class="bar c-${e.type}"></span><span class="t"><b>${esc(e.name)}</b><small>${esc(e.en)} · ${C.GM[g.m-1].slice(0,3)} ${g.d}</small></span>${countdown?`<span class="rel">${C.relative(j)}</span>`:''}`;
  b.onclick=()=>go(()=>day(j),'ዕለት · Day');return b}
function calendar(){
  const C=GeezCal;$('#tabs').hidden=false;$('#tabM').className=calTab===0?'on':'';$('#tabF').className=calTab===1?'on':'';
  $('#tabM').onclick=()=>{calTab=0;render()};$('#tabF').onclick=()=>{calTab=1;render()};
  if(calTab===1)return feasts();
  const [y,m]=monthAt(calOffset);
  const h=document.createElement('div');h.className='mh';h.innerHTML=`<button aria-label="Previous month">‹</button><div><b>${C.R.months[m-1]} ${y}</b><small>${gspan(y,m)}</small></div><button aria-label="Next month">›</button>`;
  h.children[0].onclick=()=>{calOffset--;render()};h.children[2].onclick=()=>{calOffset++;render()};view.append(h);
  if(calOffset!==0){const t=document.createElement('button');t.className='tile';t.style.justifyContent='center';t.textContent='ሎሚ · Today';t.onclick=()=>{calOffset=0;render()};view.append(t)}
  const g=document.createElement('div');g.className='grid';const order=[7,1,2,3,4,5,6];
  order.forEach(w=>g.insertAdjacentHTML('beforeend',`<div class="wdh${w===7?' sun':''}">${C.R.weekdaysShort[w-1]}</div>`));
  const first=C.ethJdn(y,m,1),lead=C.wd(first)%7,today=C.today();
  for(let i=0;i<lead;i++)g.append(document.createElement('div'));
  const month=[];
  for(let d=0;d<C.dim(y,m);d++){const j=first+d,ev=C.events(j),types=new Set(ev.map(e=>e.type));
    ev.forEach(e=>{if(e.type==='major'||e.type==='feast')month.push([j,e])});
    const c=document.createElement('button');c.className='cell'+(types.has('fast')?' fast':'')+(C.wd(j)===7?' sun':'')+(types.has('major')?' maj':'')+(j===today?' today':'');
    c.setAttribute('aria-label',C.gez(j));
    c.innerHTML=`<span class="g">${C.toG(j).d}</span><span class="e">${d+1}</span><span class="dots">${['major','feast','monthly'].filter(t=>types.has(t)).map(t=>`<i class="c-${t}"></i>`).join('')}</span>`;
    c.onclick=()=>go(()=>day(j),'ዕለት · Day');g.append(c)}
  view.append(g);
  view.insertAdjacentHTML('beforeend',`<div class="legend">${['major','feast','monthly','fast'].map(t=>`<span><i class="c-${t}"></i>${C.R.types[t]}</span>`).join('')}</div>`);
  if(month.length){view.insertAdjacentHTML('beforeend','<div class="sub">በዓላት ናይዚ ወርሒ</div>');month.forEach(([j,e])=>view.append(evRow(j,e,false)))}
}
function feasts(){
  const C=GeezCal;if(calYear===null)calYear=C.fromJdn(C.today()).y;
  const h=document.createElement('div');h.className='mh';h.innerHTML=`<button aria-label="Previous year">‹</button><div><b>ዓመተ ምሕረት ${calYear}</b><small>${calYear+7} – ${calYear+8}</small></div><button aria-label="Next year">›</button>`;
  h.children[0].onclick=()=>{calYear--;render()};h.children[2].onclick=()=>{calYear++;render()};view.append(h);
  const items=C.highlights(calYear),t=C.today(),next=items.findIndex(([j])=>j>=t);
  items.forEach(([j,e],i)=>{if(i===next)view.insertAdjacentHTML('beforeend','<div class="sub" style="color:var(--rubric)">ዝመጽእ · Upcoming</div>');view.append(evRow(j,e,true))});
  if(next>2)setTimeout(()=>view.querySelectorAll('.sub')[0]?.scrollIntoView({block:'start'}),30);
}
function day(j){
  const C=GeezCal,E=C.fromJdn(j),ev=C.events(j),isT=j===C.today();
  view.insertAdjacentHTML('beforeend',`<div class="daynav"><button id="dp">‹ ትማሊ</button><button id="dn">ጽባሕ ›</button></div>
   <div class="dayhead"><div class="big${isT?' today':''}">${E.d}</div><div><b>${C.R.weekdays[C.wd(j)-1]}፡ ${C.gez(j)}</b><small>${C.greg(j)}</small><em>${C.relative(j)}</em></div></div>`);
  $('#dp').onclick=()=>{stack[stack.length-1][0]=()=>day(j-1);render()};$('#dn').onclick=()=>{stack[stack.length-1][0]=()=>day(j+1);render()};
  if(!ev.length)view.insertAdjacentHTML('beforeend','<p class="pg">ኣብዚ ዕለት በዓል የለን</p>');
  ev.forEach(e=>view.insertAdjacentHTML('beforeend',`<div class="evc"><span class="bar c-${e.type}"></span><div><b>${esc(e.name)}</b><small>${esc(e.en)}</small><span style="color:${e.type==='major'?'var(--rubric)':e.type==='feast'?'#B8860B':e.type==='fast'?'#7E57C2':'#3E8E6E'}">${C.R.types[e.type]}${e.detail?' · '+e.detail:''}</span></div></div>`));
  {const cats=Mezmur.forDay(MEZ,j),sea=Mezmur.seasonal(MEZ,j),shown=cats.length?cats:[MCATS.find(c=>(c.cal||{}).always)];
   const box=document.createElement('div');box.className='evc';box.innerHTML='<span class="bar" style="background:var(--gold)"></span><div><b style="font-size:14px;color:var(--rubric)">♪ መዝሙር ናይ ዕለቱ</b><div class="chips3" style="margin-top:8px"></div></div>';
   const cw=box.querySelector('.chips3');shown.forEach(c=>{const b=document.createElement('button');b.textContent=`${c.name} (${c.hymns.length})`;b.onclick=()=>go(()=>hymnList(c),c.name);cw.append(b)});
   if(sea.length){const b=document.createElement('button');b.textContent=`ናይዚ ወቕቲ (${sea.length})`;b.onclick=()=>go(()=>hymnView(sea,0),'ናይዚ ወቕቲ');cw.append(b)}
   view.append(box)}
  const w=DATA.books[1].sections.find(s=>s.weekday===C.wd(j));
  if(w)tile(['✦','gold'],w.title,'ውዳሴ ማርያም ናይ ዕለቱ · '+w.en,'',()=>openSec(DATA.books[1],w));
}


const AB_ICONS=['<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5"/></svg>', '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>'];
function aboutView(){
  const A=DATA.about;let h=`<div class="rh">☩</div><div class="rh" style="text-decoration:none;font-size:22px">${DATA.title}</div><p class="pr" style="text-align:center">${esc(DATA.colophon)}</p>`;
  if(A){h+=`<div class="ab"><hr><h3>${esc(A.title)} <small>(${esc(A.en)})</small></h3>${A.intro.map(p=>`<p>${esc(p)}</p>`).join('')}<h4>${esc(A.contributionsTitle)}</h4>`+
    A.contributions.map((c,i)=>`<div class="ct"><span class="ic">${AB_ICONS[i%AB_ICONS.length]}</span><div><b>${esc(c.title)}</b><span>${esc(c.text)}</span></div></div>`).join('')+
    A.closing.map(p=>`<p>${esc(p)}</p>`).join('')+
    (A.app?`<div class="appbox"><h3><span style="display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>${esc(A.app.title)} <small>(${esc(A.app.en)})</small></h3><p>${esc(A.app.intro)}</p><div class="chips2">${A.app.items.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p>${esc(A.app.outro)}</p></div>`:'')+'</div>'}
  h+=`<div class="ab"><h3>መዝሙር <small>(Hymns)</small></h3></div>${credit(true)}`;
  h+='<p class="pg" style="margin-top:18px">Digital edition by Weegix Technology Solutions</p>';
  view.insertAdjacentHTML('beforeend',h);
}


// ---- Mezmur (hymns) ----
const HN={};MEZ.hymns.forEach(h=>HN[h.n]=h);
const MCATS=MEZ.categories.filter(c=>c.hymns.length);
const credit=full=>`<div class="credit"><span style="color:var(--gold)">✿</span><div><b>ምንጪ · Source</b>${esc(MEZ.source.ti)}${full?`<small>${esc(MEZ.source.en)}</small><small>${esc(MEZ.source.note)}</small>`:''}</div></div>`;
function hrow(h,onclick,sub){const b=document.createElement('button');b.className='hrow';b.innerHTML=`<span class="num">${h.n}</span><span><span class="tt">${esc(h.title)}</span>${sub?`<small>${esc(sub)}</small>`:''}</span>`;b.onclick=onclick;return b}
function catTile(c,hl){return tile([c.long?'♫':'♪',hl?'gold':''],c.name,`${c.en} · ${c.hymns.length} መዝሙር`,hl?'today':'',()=>go(()=>hymnList(c),c.name))}
function mezHome(){
  const C=GeezCal,j=C.today(),cats=Mezmur.forDay(MEZ,j),sea=Mezmur.seasonal(MEZ,j);
  view.insertAdjacentHTML('beforeend',`<div class="rh" style="text-decoration:none;font-size:21px">${esc(MEZ.title)}</div><div class="en">${esc(MEZ.en)}</div>${credit(false)}<div class="sub" style="color:var(--rubric)">መዝሙር ናይ ሎሚ · For today <small style="color:var(--muted);font-weight:400">${C.R.weekdays[C.wd(j)-1]}፡ ${C.gez(j)}</small></div>`);
  $('#srch').onclick=()=>go(hymnSearch,'ድለ መዝሙር');
  if(!cats.length&&!sea.length)catTile(MCATS.find(c=>(c.cal||{}).always),true);
  cats.forEach(c=>catTile(c,true));
  if(sea.length){view.insertAdjacentHTML('beforeend','<div class="sub">ናይዚ ወቕቲ · This season</div>');sea.forEach((h,i)=>view.append(hrow(h,()=>go(()=>hymnView(sea,i),'ናይዚ ወቕቲ'),MEZ.categories[h.cat].name)))}
  view.insertAdjacentHTML('beforeend','<div class="label">ዓይነታት መዝሙር · CATEGORIES</div>');
  MCATS.forEach(c=>catTile(c,false));
}
function hymnList(c){const list=c.hymns.map(n=>HN[n]).filter(Boolean);list.forEach((h,i)=>view.append(hrow(h,()=>go(()=>hymnView(list,i),c.name))))}
function hymnView(list,i){
  const h=list[i],rp=t=>esc(t).replace(/(\(\d\)|“ኣዝ”|\(ኣዝ\))/g,'<span class="rp">$1</span>');
  const d=document.createElement('div');d.className='hymn';
  d.innerHTML=`<h3><span>${h.n}</span>${esc(h.n>=300?h.title:MEZ.categories[h.cat].name)}</h3><div class="body pr" style="padding:0;font-size:${fs}px">${h.lines.map(l=>l?rp(l):'').join('\n')}</div>${h.note?`<div class="nt">📖 ${esc(h.note)}</div>`:''}${h.page?`<div class="pg">ገጽ ${h.page}</div>`:''}`;
  view.append(d);
  if(list.length>1){$('#nav').hidden=false;$('#pos').textContent=(i+1)+' / '+list.length;$('#prev').disabled=i===0;$('#next').disabled=i===list.length-1;
    $('#prev').onclick=()=>{stack[stack.length-1][0]=()=>hymnView(list,i-1);render()};$('#next').onclick=()=>{stack[stack.length-1][0]=()=>hymnView(list,i+1);render()}}
}
function hymnSearch(){
  view.insertAdjacentHTML('beforeend','<label for="hq" class="label">ድለ መዝሙር ወይ ቁጽሪ · SEARCH HYMNS OR NUMBER</label><input id="hq" placeholder="e.g. ማርያም or 245"><div id="hres"></div>');
  const q=$('#hq');q.focus();q.oninput=()=>{const v=q.value.trim(),r=$('#hres');r.innerHTML='';if(!v)return;
    const res=/^\d+$/.test(v)?(HN[+v]?[HN[+v]]:[]):MEZ.hymns.filter(h=>(h.title+'\n'+h.lines.join('\n')).includes(v)).slice(0,150);
    if(!res.length){r.innerHTML='<p class="pg">No results</p>';return}
    res.forEach((h,i)=>{const hit=h.lines.find(l=>l.includes(v));r.append(hrow(h,()=>go(()=>hymnView(res,i),'ድለ'),MEZ.categories[h.cat].name+(hit&&hit!==h.title?' · '+hit:'')))})}
}

const defaultSearch=()=>go(search,'ድለ · Search');$('#srch').onclick=defaultSearch;
go(home,'ውዳሴ ማርያም');
</script>
