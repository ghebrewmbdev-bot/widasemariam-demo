<style>
[hidden]{display:none!important}
:root{--bg:#EFE6D6;--page:#FBF6EC;--card:#FFFFFF;--ink:#1F1A17;--muted:#6E6258;--rubric:#B3261E;--maroon:#6D1B1B;--gold:#C9A227;--line:rgba(201,162,39,.35);--hl:rgba(201,162,39,.18)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#0E0C0A;--page:#15120F;--card:#221D19;--ink:#EDE6DA;--muted:#A89D90;--rubric:#FF8A80;--maroon:#2A211C;--line:rgba(255,255,255,.1)}

.bar button:hover,.bar button:focus-visible{background:rgba(255,255,255,.14);outline:none}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}

.hero .x{color:var(--gold);font-size:34px}.hero h2{font:700 24px "Noto Serif Ethiopic",serif;margin:4px 0}.hero p{margin:0;color:#F3D98B;font-size:13px}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td{padding:9px 4px;border-bottom:1px solid var(--line)}

input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px "Noto Serif Ethiopic",serif}

.hero{position:relative}.datechip{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(201,162,39,.45);color:#fff;border-radius:999px;padding:4px 10px;font:12px "Noto Sans Ethiopic",sans-serif;cursor:pointer}
.datechip:hover,.datechip:focus-visible{background:rgba(255,255,255,.24);outline:none}.datechip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hero{padding-top:40px}
.mh{display:flex;align-items:center;gap:6px}.mh button{background:none;border:0;color:var(--ink);font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer}.mh button:hover{background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.wdh{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}.wdh.sun{color:var(--rubric)}
.cell{position:relative;aspect-ratio:.8;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;padding:0}
.cell:hover,.cell:focus-visible{background:var(--line);outline:none}.cell.fast{background:rgba(126,87,194,.09)}
.cell .g{position:absolute;top:3px;right:5px;font-size:10px;color:var(--muted)}
.cell .e{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:34px;height:34px;display:grid;place-items:center;font-size:18px;border-radius:50%}
.cell.sun .e,.cell.maj .e{color:var(--rubric)}.cell.maj .e{font-weight:800}.cell.today .e{background:var(--rubric);color:#fff}
.cell .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}.cell .dots i{width:6px;height:6px;border-radius:50%}
.c-major{background:var(--rubric)}.c-feast{background:#B8860B}.c-monthly{background:#3E8E6E}.c-fast{background:#7E57C2}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%}.legend i.c-fast{border-radius:2px;opacity:.35}
.ev{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.ev .d{width:52px;text-align:center;flex:none}.ev .d b{display:block;font-size:21px}.ev .d small{font-size:11px}.ev .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ev .t{flex:1}.ev .t b{display:block;font:600 16px "Noto Serif Ethiopic",serif}.ev .t small,.ev .rel{color:var(--muted);font-size:12px}.ev.past{opacity:.55}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--page)}.tabs button{flex:1;background:none;border:0;padding:10px;font:inherit;color:var(--muted);cursor:pointer}.tabs button.on{color:var(--rubric);font-weight:600;box-shadow:inset 0 3px 0 var(--rubric)}
.dayhead{display:flex;gap:14px;align-items:center}.dayhead .big{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--rubric);background:color-mix(in srgb,var(--rubric) 10%,transparent);flex:none}.dayhead .big.today{background:var(--rubric);color:#fff}
.dayhead b{display:block;font-size:19px}.dayhead small{display:block;color:var(--muted)}.dayhead em{font-style:normal;color:var(--rubric);font-weight:600;font-size:13px}
.evc{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.evc .bar{width:6px;flex:none}.evc div{padding:11px 14px}.evc b{display:block;font:600 18px "Noto Serif Ethiopic",serif}.evc small{display:block;color:var(--muted)}.evc span{font-size:12.5px}
.daynav{display:flex;justify-content:space-between}.daynav button{background:none;border:1px solid var(--line);color:var(--rubric);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.sub{font-size:13px;font-weight:600;margin:8px 4px 0}
.ab h3{font:700 22px "Noto Serif Ethiopic",serif;color:var(--rubric);margin:18px 0 8px;display:flex;align-items:center;gap:8px}.ab h3 small{font:400 13px "Noto Sans Ethiopic",sans-serif;color:var(--muted)}
.ab p{font-family:"Noto Serif Ethiopic",serif;line-height:1.75;margin:0 0 10px}.ab h4{margin:10px 0 8px;font-size:16px}
.ab .ct{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}.ab .ct .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(201,162,39,.18);color:#9A7A12}
.ab .ct b{display:block;color:var(--rubric);font-size:16px}.ab .ct span{font-family:"Noto Serif Ethiopic",serif;line-height:1.6;font-size:15px}
.ab .appbox{border:1.5px solid var(--gold);border-radius:16px;padding:4px 16px 12px;background:rgba(201,162,39,.07);margin-top:8px}.ab .chips2{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}.ab .chips2 span{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}.ab .chips2 span::before{content:"✓ ";color:var(--rubric);font-weight:700}
.ab hr{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
.mezchip{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(201,162,39,.45);color:#fff;border-radius:999px;padding:4px 10px;font:12px "Noto Sans Ethiopic",sans-serif;cursor:pointer}
.mezchip:hover,.mezchip:focus-visible{background:rgba(255,255,255,.24);outline:none}
.credit{display:flex;gap:10px;border:1px solid rgba(201,162,39,.6);background:rgba(201,162,39,.07);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}.credit b{display:block;color:var(--rubric);font-size:12px}.credit small{display:block;color:var(--muted)}
.hrow{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;color:var(--ink);font:inherit;cursor:pointer}.hrow:hover{background:var(--line)}
.hrow .num{width:34px;text-align:right;color:var(--rubric);font-weight:700;flex:none;font-variant-numeric:tabular-nums}.hrow .tt{font-family:"Noto Serif Ethiopic",serif;font-size:16px}.hrow small{display:block;color:var(--muted);font-size:12px}
.hymn h3{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;font:700 20px "Noto Serif Ethiopic",serif;color:var(--rubric)}.hymn h3 span{background:var(--rubric);color:#fff;border-radius:8px;padding:2px 9px;font:700 15px "Noto Sans Ethiopic",sans-serif}
.hymn .body{font-family:"Noto Serif Ethiopic",serif;line-height:1.75;white-space:pre-line}.hymn .rp{color:var(--rubric);font-weight:700;font-size:.82em}.hymn .nt{margin-top:14px;color:var(--muted);font-size:13px}
.chips3{display:flex;flex-wrap:wrap;gap:8px}.chips3 button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:14px "Noto Sans Ethiopic",sans-serif;color:var(--ink);cursor:pointer}
.note{max-width:440px;margin:14px auto 0;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div class="phone">
  <div class="bar"><button id="back" aria-label="Back">←</button><h1 id="ttl">ውዳሴ ማርያም</h1>
    <button id="srch" aria-label="Search">⌕</button><button id="fm" aria-label="Smaller text">A−</button><button id="fp" aria-label="Larger text">A+</button></div>
  <main id="view"></main>
  <div class="tabs" id="tabs" hidden><button id="tabM">ወርሒ · Month</button><button id="tabF">በዓላት · Feasts</button></div>
  <div class="nav" id="nav" hidden><button id="prev">‹ ቅድሚ</button><span id="pos"></span><button id="next">ቀጺሉ ›</button></div>
</div>
<p class="note">ውዳሴ ማርያም በልሣነ ግዕዝ · Demo of the Widasie Mariam app by Weegix Technology Solutions. Works offline in any browser.</p>
<script>
// Ge'ez calendar logic for the demo (mirrors lib/calendar/geez_calendar.dart)
const GeezCal=(function(){
const EPOCH=1724221;
const ethJdn=(y,m,d)=>EPOCH-1+365*(y-1)+Math.floor(y/4)+30*(m-1)+d;
const fromJdn=j=>{const y=Math.floor((4*(j-EPOCH)+1463)/1461);const n=j-ethJdn(y,1,1);return {y,m:Math.floor(n/30)+1,d:n%30+1}};
const isLeap=y=>y%4===3, dim=(y,m)=>m<13?30:(isLeap(y)?6:5);
const gJdn=(y,m,d)=>{const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045};
const toG=j=>{const a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);return {y:100*b+d-4800+Math.floor(m/10),m:m+3-12*Math.floor(m/10),d:e-Math.floor((153*m+2)/5)+1}};
const julJdn=(y,m,d)=>{const a=Math.floor((14-m)/12),y2=y+4800-a,m2=m+12*a-3;return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-32083};
const easter=gy=>{const a=gy%4,b=gy%7,c=gy%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,mo=Math.floor((d+e+114)/31),da=(d+e+114)%31+1;return julJdn(gy,mo,da)};
const wd=j=>j%7+1; // 1=Mon..7=Sun
const today=()=>{const t=new Date();return gJdn(t.getFullYear(),t.getMonth()+1,t.getDate())};
const ORDER={major:0,feast:1,monthly:2,fast:3};
let R=null; const cache={};
function build(year){
  const start=ethJdn(year,1,1),end=ethJdn(year+1,1,1),gY=year+8,E=easter(gY),map={};
  const add=(j,e)=>{if(j>=start&&j<end)(map[j]=map[j]||[]).push(e)};
  const resolve=p=>'easter' in p?E+p.easter:'gregorian' in p?gJdn(gY,p.gregorian[0],p.gregorian[1]):ethJdn(year,p.month,p.day);
  R.gregorian.forEach(r=>add(gJdn(gY,r.month,r.day),{name:r.name,en:r.en,type:r.type}));
  R.annual.forEach(r=>add(ethJdn(year,r.month,r.day),{name:r.name,en:r.en,type:r.type}));
  R.easter.forEach(r=>{if(r.type!=='fast')add(E+r.offset,{name:r.name,en:r.en,type:r.type})});
  for(let m=1;m<=12;m++)R.monthly.forEach(r=>add(ethJdn(year,m,r.day),{name:r.name,en:r.en,type:'monthly'}));
  const inFast=new Set();
  R.fasts.forEach(f=>{const a=resolve(f.from),b=resolve(f.to),t=b-a+1;for(let j=a;j<=b;j++){inFast.add(j);add(j,{name:f.name,en:f.en,type:'fast',detail:`ዕለት ${j-a+1} ካብ ${t}`})}});
  const noFast=new Set([...R.gregorian.map(r=>gJdn(gY,r.month,r.day)),ethJdn(year,5,11)]);
  for(let j=start;j<end;j++){const w=wd(j);if((w===3||w===5)&&!(j>=E&&j<=E+49)&&!noFast.has(j)&&!inFast.has(j))add(j,{name:R.weeklyFast.name,en:R.weeklyFast.en,type:'fast'})}
  Object.values(map).forEach(l=>l.sort((a,b)=>ORDER[a.type]-ORDER[b.type]));
  return map;
}
const events=j=>{const y=fromJdn(j).y;return (cache[y]=cache[y]||build(y))[j]||[]};
const highlights=year=>{const out=[];for(let j=ethJdn(year,1,1);j<ethJdn(year+1,1,1);j++)events(j).forEach(e=>{if(e.type==='major'||e.type==='feast'||(e.type==='fast'&&e.detail&&e.detail.startsWith('ዕለት 1 ')))out.push([j,e])});return out};
const GM=['January','February','March','April','May','June','July','August','September','October','November','December'];
const GW=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const relative=j=>{const d=j-today();return d===0?'ሎሚ':d===1?'ጽባሕ':d===-1?'ትማሊ':d>0?`ድሕሪ ${d} መዓልቲ`:`ቅድሚ ${-d} መዓልቲ`};
return {init:r=>{R=r},easterJdn:easter,ethJdn,fromJdn,dim,toG,wd,today,events,highlights,relative,GM,GW,
  gez:j=>{const e=fromJdn(j);return `${R.months[e.m-1]} ${e.d}, ${e.y}`},
  greg:j=>{const g=toG(j);return `${GW[wd(j)-1]}, ${GM[g.m-1]} ${g.d}, ${g.y}`},
  get R(){return R}};
})();


// ---- hymn day matching (mirrors lib/mezmur/mezmur.dart) ----
const Mezmur={
 match(c,j){const C=GeezCal,cal=c.cal||{},e=C.fromJdn(j);
  if(cal.m&&cal.m.includes(e.d))return true;
  for(const d of cal.d||[])if(d[0]===e.m&&d[1]===e.d)return true;
  for(const r of cal.r||[]){const a=C.ethJdn(e.y,r[0][0],r[0][1]),b=C.ethJdn(e.y,r[1][0],r[1][1]);if(j>=a&&j<=b)return true}
  if(cal.e){const E=C.easterJdn(e.y+8);for(const o of cal.e){if(typeof o==='number'&&j===E+o)return true;if(Array.isArray(o)&&j>=E+o[0]&&j<=E+o[1])return true}}
  if(cal.fast&&C.events(j).some(x=>x.type==='fast'&&x.detail))return true;return false},
 forDay(M,j){return M.categories.filter(c=>c.hymns.length&&!(c.cal||{}).always&&!c.long&&Mezmur.match(c,j))},
 seasonal(M,j){const e=GeezCal.fromJdn(j),wk=Math.min(4,Math.floor((e.d-1)/7)+1);return M.hymns.filter(h=>h.season&&h.season.months.includes(e.m)&&(!h.season.week||h.season.week===wk))}
};

const DATA = {"title": "ውዳሴ ማርያም በልሣነ ግዕዝ", "subtitle": "Widasie Mariam in Ge'ez", "books": [{"id": "zewetir", "title": "ጸሎት ዘዘወትር", "en": "Daily Prayers", "sections": [{"id": "zewetir_1", "title": "አዐትብ ገጽየ", "en": null, "page": 3, "intro": "ጸሎት ዘዘወትር", "items": [{"n": 1, "text": "አዐትብ ገጽየ ወኩለንታየ በትእምርተ መስቀል። በስመ ኣብ ወወልድ ወመንፈስ ቅዱስ ኣሓዱ ኣምላክ። በስመ አብ ወወልድ ወመንፈስ ቅዱስ አሓዱ አምላክ በቅድስት ሥላሴ እንዘ አአምን ወእትመኅፀን እክሕደከ ሰይጣን በቅድመ ዛቲ እምየ ቅድስት ቤተ ክርስትያን እንተ ይእቲ ስምዕየ ማርያም ጽዮን ለዓለም ዓለም።", "page": 3, "label": "አዐትብ"}]}, {"id": "zewetir_2", "title": "ነኣኩተከ እግዚኦ", "en": "We give thanks", "page": 4, "items": [{"n": 2, "text": "ነኣኩተከ እግዚኦ ወንሴብሐከ። ንባርከከ እግዚኦ ወንትኣመነከ ንገኒ ለከ እግዚኦ ወንትቀነይ ለስምከ ቅዱስ። ንሰግድ ለከ ኦ ዘለከ ይሰግድ ኩሉ ብርክ ወለከ ይትቀነይ ኩሉ ልሳን። ኣንተ ዉእቱ ኣምላከ ኣማልክት፡ ወእግዚኣ ኣጋእዝት፡ ወንጉሠ ነገሥት፡ ኣምላክ ኣንተ ለኩሉ ዘሥጋ ወለኩሉ ዘነፍስ፡ ወንጼዉዓከ በከመ መሐረነ ቅዱስ ወልድከ እንዘ ይብል ኣንትሙሰ ሶበ ትጼልዩ ከመዝ በሉ።", "page": 4, "label": "ነኣኩተከ"}]}, {"id": "zewetir_3", "title": "ኣቡነ ዘበሰማያት", "en": "The Lord's Prayer", "page": 5, "items": [{"n": 3, "text": "ኣቡነ ዘበሰማያት ይትቀደስ ስምከ፤ትምጻእ መንግሥትከ ወይኩን ፈቃድከ በከመ በሰማይ ከማሁ በምድር ፡ ሲሳየነ ዘለለ ዕለትነ ሀበነ ዮም። ኅድግ ለነ ኣበሳነ ወጌጋየነ ከመ ንሕነኒ ንኅድግ ለዘኣበሰለነ። ኢታብኣነ እግዚኦ ውስተ መንሱት። ኣላ ኣድኅነነ ወባልሐነ እምኩሉ እኩይ ፡፡እስመ ዚአከ ይእቲ መንግሥት ኃይል ወስብሐት ለዓለመ ዓለም። ኣሜን", "page": 5, "label": "ኣቡነ"}]}, {"id": "zewetir_4", "title": "በሰላም ቅዱስ ገብርኤል መልአክ", "en": "Hail Mary", "page": 6, "items": [{"n": 4, "text": "በሰላም ቅዱስ ገብርኤል መልአክ ኦ እግዝእትየ ማርያም ሰላም ለኪ። ድንግል በሕሊናኪ ወድንግል በሥጋኪ እመ እግዚአብሔር ጸባዖት ሰላም ለኪ፡ ቡርክት አንቲ እምአንስት ወቡሩክ ፍሬ ከርሥኪ። ተፈሥሒ ፍሥሕት ኦ ምልእተ ጸጋ እግዚአብሔር ምስሌኪ፡ ሰአሊ ወጸልዩ ለነ ኀበ ፍቁር ወልድኪ ኢየሱስ ክርስቶስ ከመ ይሥረይ ለነ ኃጣዉኢነ። ኣሜን", "page": 6, "label": "በሰላም"}]}, {"id": "zewetir_5", "title": "ጸሎተ ሃይማኖት", "en": "The Creed", "page": 7, "items": [{"n": 5, "text": "ጸሎተ ሃይማኖት ነአምን በ፩ዱ ኣምላክ እግዚኣብሔር ኣብ ኣኃዜ ኩሉ ዓለም ገባረ ሰማያት ወምድር ዘኢያስተርኢ ወዘኢያስተርኢ። ወነኣምን በ፩ዱ እግዚእ ኢየሱስ ክርስቶስ ወልደ ኣብ ዋሕድ ዘህልው ምስሌሁ እምቅድመ ይትፈጠር ዓለም። ብርሃን ዘእምብርሃን ኣምላክ ዘእምኣምላክ ዘበኣማን። ዘተወልደ ወኣኮ ዘተገብረ ዘዕሩይ ምስለ ኣብ በመለኮቱ። ዘቦቱ ኩሉ ኮነ ወዘእንበሌሁሰ ኣልቦ ዘኮነ ወኢምንትኒ ዘበሰማይኒ ወዘበምድርኒ።ዘበእንቲኣነ ለሰብእ ወበእንተ መድኃኒትነ ወረደ እምሰማያት። ተስብኣ ወተሠገወ ወእመንፈስ ቅዱስ ወእማርያም እምቅድስት ድንግል። ኮነ ብእሲ ወተሰቅለ በእንቲኣነ በመዋዕለ ጵላጦስ ጴንጤናዊ ሓመ ወሞተ ወተቀብረ ወተንሥአ እሙታን ኣመ ሣልስት ዕለት በከመ ጽሑፍ ዉስተ ቅዱሳት መጻሕፍት። ዐርገ በስብሓት ዉስተ ሰማያት ወነበረ በየማነ ኣቡሁ፡ ዳግመ ይመጽእ በስብሓት ይኮንን ሕያዋነ ወሙታነ ወኣልቦ ማኅለቅት ለመንጉሥቱ። ወነኣምን በመንፈስ ቅዱስ እግዚእ ማሕየዊ ዘሰረፀ እምአብ ንስግድ ሎቱ ወንሰብሖ ምስለ ኣብ ወወልድ ዘነበበ በነቢያት። ወነኣምን በኣሐቲ ቅድስት ቤተ ክርስቲያን እንተ ላዕለ ኩሉ ጉባኤ ዘሐዋሪያት፡ ወነኣምን በኣሓቲ ጥምቀት ለሥርየተ ኃጢኣት። ወንሴፎ ትንሣኤ ሙታን ወሕይወተ ዘይመጽእ ለዓለመ ዓለም።", "page": 7, "label": "ጸሎተ"}]}, {"id": "zewetir_6", "title": "ቅዱስ ቅዱስ ቅዱስ እግዚኣብሔር", "en": "Holy, Holy, Holy", "page": 9, "items": [{"n": 6, "text": "ቅዱስ ቅዱስ ቅዱስ እግዚኣብሔር ጸባዖት ፍጹም ምሉእ ሰማያተ ወምድረ ቅድሳተ ስብሓቲከ። ንሰግድ ለከ ክርስቶስ ምስለ ኣቡከ ኄር ሰማያዊ ወመንፈስከ ቅዱስ ማሕየዊ እስመ መጻእከ ወኣድኃንከነ።", "page": 9, "label": "ቅዱስ"}]}, {"id": "zewetir_7", "title": "እሰግድ ለኣብ", "en": "I bow to the Father", "page": 9, "items": [{"n": 7, "text": "እሰግድ ለኣብ ወወልድ ወመንፈስ ቅዱስ አሐተ ስግደተ እሰግድ ለኣብ ወወልድ ወመንፈስ ቅዱስ ኣሓተ ስግደተ እሰግድ ለኣብ ወወልድ ወመንፈስ ቅዱስ ኣሓተ ስግደተ እንዘ ኣሓዱ ሠለስቱ ወእንዘ ሠለስቱ ኣሓዱ ይሤለሱ በኣካላት ወይትወሓዱ በመለኮት እሰግድ ለእግዝእትነ ማርያም ድንግል ወላዲተ ኣምላክ እሰግድ ለመስቀለ እግዚእነ ኢየሱስ ክርስቶስ ዘተቀደሰ በደሙ ክቡር መስቀል ኃይልነ መስቀል ጽንዕነ መስቀል ቤዛነ መስቀል መድሃኒተ ነፍስነ። ኣይሁድ ክሕዱ። ንሕነሰ ኣመነ ወእለ ኣመነ በኃይለ መስቀሉ ድኅነ።", "page": 9, "label": "እሰግድ"}]}, {"id": "zewetir_8", "title": "ስብሐት ለኣብ", "en": "Glory to the Father", "page": 11, "items": [{"n": 8, "text": "ስብሓት ለኣብ ስብሓት ለወልድ ስብሓት ለመንፈስ ቅዱስ /3/ ፤ ስብሓት ለእግዝእትነ ማርያም ድንግል ወላዲተ ኣምላክ ፤ ስብሓት ለመስቀለ እግዚእነ ኢየሱስ ክርስቶስ ፤ ክርስቶስ በምሕረቱ ይዘክረነ ፤ ኣመ ዳግም ምጽኣቱ ኢያስተኃፈረነ ፤ ለሰብሖተ ስሙ ያንቅሓነ ፤ ወበኣምልኮቱ ያጽንኣነ ፤ እግዝእትነ ማርያም ድንግል ወላዲተ ኣምላክ ኣእርጊ ጸሎትነ ፤ ወኣስተስርዪ ኩሎ ሃጢኣተነ ፤ ቅድመ መንበሩ ለእግዚእነ ፤ ለዘኣብልኣነ ዘንተ ኅብስተ ፤ ወለአስተየነ ዘንተ ጽዋዐ ፤ ወለዘሠርዐ ለነ ሲሳየነ ወዐራዘነ ፤ ወለዘተዓገሰ ለነ ኩሎ ኃጢኣተነ ፤ ወለዘወሀበነ ሥጋሁ ቅዱሰ ወደሞ ክቡረ ፤ ወለዘአብጽሓነ እስከ ዛቲ ሰዓት፡፡ ነሀብ ሎቱ ስብሓተ ውኣኰቴተ ለእግዚኣብሔር ልዑል ወለወላዲቱ ድንግል ወለመስቀሉ ክቡር ይትኣኰት ወይሰባሕ ስሙ ለእዚኣብሔር ኣምላክነ ወትረ በክሉ ጊዜ ወበኩሉ ሰዓት፡፡ ሀሌ ሉያ ሰብሕዎ ወወድስዎ በአሐቲ ቃል ሣራረሀ ኩሉ ዓለም ።", "page": 11, "label": "ስብሓት"}]}, {"id": "zewetir_9", "title": "ሰላም ለኪ", "en": "Peace be unto you", "page": 13, "items": [{"n": 9, "text": "ሰላም ለኪ እንዘ ንሰግድ ንብለኪ ማርያም እምነ ናስተበቁዐኪ። እምኣርዌ ነኣዊ ተማኅጸነ ብኪ። በእንተ ሓና ኢምኪ ወኢያቄም ኣቡኪ ማኅበረነ ዮም ድንግል ባርኪ።", "page": 13, "label": "ሰላም ለኪ"}]}, {"id": "zewetir_10", "title": "ጸሎተ እግዝእትነ", "en": "Prayer of Our Lady (Magnificat)", "page": 13, "items": [{"n": 10, "text": "ጸሎተ እግዝእትነ ማርያም ድንግል ወላዲተ ኣምላክ። ታዐብዮ ነፍስየ ለእግዚኣብሔር። ወትትኃሠይ መንፈስየ በኣምላኪየ ወመድኃንየ፤ እስመ ርእየ ሕማማ ለኣመቱ። ናሁ እምይእዜሰ ያስተበፅዑኒ ኩሉ ትዉልድ። እስመ ገብረ ሊተ ኃይለ ዐቢያተ ወቅዱስ ስሙ። ወሣህሉኒ ለትውልደ ትዉልድ ለእለ ይፈርህዎ። ወገብረ ኃይለ በመዝራዕቱ፡ ወዘረዎሙ ለእለ ያዐብዩ ሕሊና ልቦሙ፡ ወነሠቶሙ ለኃያላን እመ ናብርቲሆሙ። ኣዕበዮሙ ለትሑታን፡ ወኣጽገቦምሙ እምበረከቱ ለርኁባን፡ ወፈነዎሙ ዕራቆሙ ለብዑላን ወተወክፎ ለእስራኤል ቍልዔሁ፡ ወተዘከረ ሣህሎ ዘይቤሎሙ ለኣበዊነ ለኣብርሃም ወለዘርኡ እስከ ለዓለም። ሉቃስ ፩፡፵፮-፶፭። ስብሓት ለኣብ ወወልድ ወመንፈስ ቅዱስ፡ ለዓለም ወለዓለመ ዓለም ኣሜን።", "page": 13, "label": "ጸሎተ"}]}]}, {"id": "widase", "title": "ውዳሴ ማርያም", "en": "Praise of Mary (by day)", "sections": [{"id": "widase_1", "title": "ቅድመ ውዳሴ", "en": "Before the Widase", "page": 15, "items": [{"n": null, "text": "ኦ እግዚእትየ ፍትኅኒ እማይሰሩ ለሰይጣን እሙ ለመድኅን ወለተ ብርሃን ባርኪኒ ቀድስኒ ወአንፅኅኒ በከመ ባርክዮ ለቅዱስ ኤፍሬም ፍቁርኪ በረከተ ፍቁር ወልድኪ ወአቡሁ ወመንፈስ ቅዱስ ይኅድር በላዕሌየ ።", "page": 15}]}, {"id": "widase_2", "title": "ውዳሴ ዘሰኑይ", "en": "Monday", "page": 16, "intro": "ዉዳሴሃ ለእግዝእትነ ማርያም ድንግል ወላዲተ ኣምላክ ዘይትነበብ በዕለተ ሰኑይ።", "items": [{"n": 1, "text": "ፈቀደ እግዚእ ያግዕዞ ለኣዳም ኅዙነ ወትኩዘ ልብ ወያግብኦ ኀበ ዘትካት መንበሩ፡ ሰኣሊ ለነ ቅድስት።", "page": 16, "label": "ፈቀደ"}, {"n": 2, "text": "ሠረቀ በሥጋ እምድንግል ዘእንበለ ዘርኣ ብእሲ ወኣድኃነነ።ለሔዋን እንተ ኣስሓታ ከይሲ ፈትሓ ላዕሌሃ እግዚኣብሔር እንዘ ይብል ብዙኃ ኣበዝኆ ለሕማምኪ ወለፃርኪ፡ ሠምረ ልቡ ኀበ ፍቅረ ሰብእ ወኣግዐዛ፡ ሰኣሊ ለነ ቅድስት።", "page": 16, "label": "ለሔዋን"}, {"n": 3, "text": "ኢየሱስ ክርስቶስ ቃል ዘተሰብኣ ወኃደረ ላዕሌነ ወርኢነ ስብሓቱሁ ከመ ስብሕተ ፩ዱ ዋሕድ ለኣቡሁ ሠምረ ይሣሃለነ፡ ሰኣሊ ለነ ቅድስት።", "page": 17, "label": "ኢየሱስ"}, {"n": 4, "text": "ርእየ ኢሳይያስ ነቢይ በመንፈስ ትንቢት ምሥጢሮ ለኣማኑኤል ወበእንተዝ ጸርሐ እንዘ ይብል ሕፃን ተወልደ ለነ፡ ወልድ ተዉህበ ለነ፡ ሰኣሊ ለነ ቅድስት።", "page": 17, "label": "ርእየ"}, {"n": 5, "text": "ተፈሣህ ወተኃሠይ ኦ ዘመደ ዕጓለ እምሕያው እሰመ ኣፍቀሮ እግዚኣብሔር ልዓለም፡ ወመጠወ ወልድ ዋሕደ ከመ ይሕየዉ ኩሉ ዘየኣምን ቦቱ እስከ ለዓለም፡ ፈነወ ለነ መዝራዕቶ ልዑል፡ ሰኣሊ ለነ ቅድስት።", "page": 17, "label": "ተፈሣሕ"}, {"n": 6, "text": "ዘሀሎ ወይሄሉ ዘመጽኣ ወካዕበ ይምጽእ ኢየሱስ ክርስቶስ ቃል ዘተሰብኣ እምኔኪ ዘእንበለ ዉላጤ፡ ኮነ ፍጹም ሰብኣ፡ ኢተበአደ ወኢተፈልጠ በኩሉ ግብሩ ወልድ ዋሕድ፡ኣላ፩ዱ ራእይ፡ ወ፩ዱ ህላዌ ወ፩ዱ መለኮት ዘእግዚኣብሔር ቃል፡ ሰኣሊ ለነ ቅድስት።", "page": 18, "label": "ዘሀሎ"}, {"n": 7, "text": "ተፈሥሒ ኦ ቤተልሔም ሀገሮሙ ለነብያት እስመ በኃቤኪ ተወልደ ክርስቶስ ዳግማይ ኣዳም ከመ ያግብኦ ለኣዳም ቀዳሚ ብእሲ እምድር ዉስተ ገነት ይሥዐር ፍትሐ ሞት፡ ኦ ኣዳም መሬት ኣንተ ወትገብእ ዉስተ መሬት፡ ኀበ ሀለወት ብዝኅት ኃጢኣት በህየ ትበዝኅ ጸጋ እግዚኣብሔር፡ሰኣሊ ለነ ቅድስት።", "page": 18, "label": "ቤተልሔም"}, {"n": 8, "text": "ትትፌሣሕ ወትትሓሠይ ኩሉ ነፍስተ ሰብእ፡ ምስለ መላእክት ይሰብሕዎ ለክርስቶስ ንጉስ ይጸርሑ ወይበሉ ስብሓት ለእግዚኣብሔር በሰማያት፡ ወሰላም በምድር ሥምረቱ ለሰብእ፡ እሰመ ሠዐረ ዘትካት ወነሠተ ምክሮ ለጸላኢ፡ ወሠጠጠ መጽሐፈ ዕዳሆሙ ለኣዳም ወለሔዋን፡ ወሰዮሙ ኣግዐዝያነ ዘተወልደ ለነ በሀገረ ዳዊት መድኃኒነ ኢየሱስ ክርስቶስ፡ ሰኣሊ ለነ ቅድስት።", "page": 19, "label": "ትትፌሣሕ"}, {"n": 9, "text": "ብርሃን ዘበኣማን ዘያበርህ ለኩሉ ሰብእ ለእለ ይነብሩ ዉስተ ዓለም፡በእንተ ፍቅረ ሰብእ መጸእከ ዉስተ ዓለም ወኩሉ ፍጥረት ተፈሥሐ በምጽኣትከ፡ እስመ ኣድኃንኮ ለኣዳም እምስሕተት፡ ወረሰይካ ለሔዋን ኣግዓዚተ እምፃዕረ ሞት ወወሀብከነ መንፈሰ ልደት፡ ባረክናከ ምስለ መላእክቲከ፡ሰኣሊ ለነ ቅድስት።", "page": 19, "label": "ብርሃን"}], "weekday": 1}, {"id": "widase_3", "title": "ውዳሴ ዘሠሉስ", "en": "Tuesday", "page": 20, "intro": "ዉዳሴሃ ለእግዝእትነ ማርያም ድንግል ወላዲተ ኣምላክ ዘይትነበብብ ዕለተ ሠሉስ።", "items": [{"n": 1, "text": "አክሊለ ምክሕነ ወቀዳሚተ መድኃኒትነ ወመሰረተ ንጽሕነ ኮነ በማርያም ድንግል፡ እንተ ወለደት ለነ ዘእግዚኣብሔር ቃለ፡ ዘኮነ ሰብኣ በእንተ መድኃኒትነ፡ እምድኃረ ኮነ ሰብአ ጥዩቀ ኣምላክ ፍጹም ዉእቱ፡ ወበእንተዝ ወለደቶ እንዘ ደንግል ይእቲ መንክር ኃይለ ወሊዶታ ዘኢይትነገር፡ ሰአሊ ለነ ቅድስት።", "page": 20, "label": "አክሊለ"}, {"n": 2, "text": "እስመ በፈቃዱ ኣቡሁ፡ ወመንፈስ ቅዱስ መጽኣ ወአድኃነነ። ዐቢይ ዉእቱ ስብሓተ ድንግልናኪ ኦ ማርያም ድንግል ፍጽምት፡ ረከብኪ ሞገሰ እግዚኣብሔር ምስሌኪ፡ ኣንቲ ዉእቱ ሰዋስዉ ዘርእየ ያዕቆብ እምድር ዘይበጽሕ እስከ ሰማይ፡ ወመላዕክተ እግዚኣብሔር የዐርጉ ወይወርዱ ዉስቴታ፡ ሰአሊ ለነ ቅድስት።", "page": 20, "label": "ዐቢይ"}, {"n": 3, "text": "ኣንቲ ውእቱ ዕጽ ዘርእየ መሴ በነደ እሳት ወኢትውኢ፣ ዘውእቱ ወልደ እግዚአብሔር መጽኣ ወኀደረ ውስተ ከርሥኪ፣ ወእሳተ መለኮቱ ኢያውዓየ ሥጋኪ፣ ሰኣሊ ለነ ቅድስት።", "page": 21, "label": "ዕጽ"}, {"n": 4, "text": "አንቲ ዉእቱ ገራህት ዘኢተዘርአ ዉስቴታ ዘርእ፡ ወዕአ እምኔኪ ፍሬ ሕይወት፡ አንቲ ዉእቲ መዝገብ ዘተሣየጠ ዮሴፍ፡ ወረከበ በዉስቴታ ባሕርየ ዕንቄ ክብረ፡ ዘዉእቱ መድኃኒነ ኢየሱስ ክርስቶስ ተፀዉረ በከርሥኪ ወወለድኪዮ ዉስተ ዓለም፡ ሰአሊ ለነ ቅድስት።", "page": 21, "label": "ገራህት"}, {"n": 5, "text": "ተፈሥሒ ኦ ወላዲተ እግዚእ ኃሤቶሙ ለመላእክት፡ ተፈሥሒ ኦ ንጽሕት ዜናሆሙ ለነብያት፡ ተፈሥሒ እስመ ረከብኪ ሞገሰ እግዚአብሔር ምስሌኪ፡ ተፈሥሒ እስመ ተወከፍኪ ቃሎ ለመልአክ ፍስሐ ኩሉ ዓለም፡ ተፈሥሒ ኦ ወላዲተ ፈጣሬ ዓለም፡ ሰኣሊ ለነ ቅድስት።", "page": 22, "label": "ኦ ወላዲተ እግዚእ"}, {"n": 6, "text": "ተፈሥሒ እስመ ድልወ ተሰመይኪ፣ ኦ ወላዲተ ኣምላክ፡ ተፈሥሒ ኦ መድኃኒታ ለሔዋን ተፈሥሒ እንተ ኣጥብውኪ ሓሊበ ለዘይሰስዮ ለኩሉ ፍጥረት፣ ተፈሥሒ ኦ ቅድስት እሞሙ ለኩሎሙ ሕያዋን፣ ናንቅዐዱ ኀቤኪ ትስአሊ በእንቲኣነ ሰኣሊ ለነ ቅድስት።", "page": 22, "label": "እስመ ድልወ"}, {"n": 7, "text": "ኦ ድንግል ኦ ቅድስት፡ ኦ ወላዲተ እግዚእ፡ እስመ ወለድኪ ለነ ንጉሥ፡ መንክር ምሥጥር ኃደረ ላዕሌኪ ለመድኃኒተ ዚአነ።ናርምም እስመ ኢንክል ፈጽሞ ጥዓቁቀ ነኒረ፡ በእንተ ዕበዩ ለዉእቱ ገባሬ ሠናያት በብዙኃ መንከሩ ራእይ፡ ሰኣሊ ለነ ቅድስት።", "page": 23, "label": "ኦ ድንግል"}, {"n": 8, "text": "ቃለ ኣብ ሕያዉ ዘወረደ ዉስተ ደብረ ሲና ወወሀበ ሕገ ለሙሴ፡ ወከደነ ርእሰ ደብር በጊሜ ዉጢስ ወጽልመት ወነፍስ፡ ወበድምፀ ቃለ ኣቅርንት ይጌሥፅ ለእለ ይቀዉሙ በፍርሃት፡ ሰኣሊ ለነ ቅድስት።", "page": 23, "label": "ቃለ"}, {"n": 9, "text": "ዉእቱ ኬ ዘወረደ ኀቤኪ፡ ኦ ደብር ነባቢት በትሕትና መፍቀሬ ሰብእ፡ ተሰብኣ እምኔኪ ዘእንበለ ዉላጤ ፍጹመ ሥጋ ነባቢ ዘከማነ፡ በመንፈሰ ጥበብ ኣምላክ ኃደረ ላዕሌሃ፡ ኮነ ፍጹመ ሰብአ ከመ ያድኅኖ ወይሥረይ ኃጢአቶ ለኣዳም፡ ወያንብሮ ዉስተ ሰማያት ወያግብኦ ኀበ ዘትካት መንበሩ፡ በዕበይ ሣህሉ ወምሕረቱ። ሰኣሊ ለነ ቅድስት።", "page": 24, "label": "ዉእቱ"}, {"n": 10, "text": "ዕበያ ለድንግል ኢይትከሃል ለተነግሮ እስመ እግዚእ ኃረያ፡ መጽአ ወኃደረ ላዕሌሃ ዘየኃድር ዉስተ ብርሃን ኅበ አልቦ ዘይቀርቦ ተፀዉረ በከርሣ ፱ተ አዉራኃ ዘኢይትረአይ ወዘኢትዓወቅ ወለደቶ ማርያም እንዘ ድንግል ይእቲ፡ ሰአሊ ለነ ቅድስት።", "page": 25, "label": "ዕበያ"}, {"n": 11, "text": "ዘዉእቱ እብን ዘርእየ ዳኒኤል ነብይ፡ ዘተበትከ እምደብር ነዋኅ ዘእንበለ፡ እድ፡ ዘዉእቱ ቃል ዘወፅኣ እምሓበ ኣብ መጽአ ወተሰብኣ እምድንግል ዘእንበለ ዘርኣ ብእሲ ወኣድኃነነ፡ ሰኣሊ ለነ ቅድስት።", "page": 25, "label": "ዘዉእቱ"}, {"n": 12, "text": "ኮንኪ ዓፅቀ ንጹሐ ወሙዳየ አሚን፡ ርትዕት ሃይማኖቶሙ ለቅዱሳን ኣበዊነ፡ ኦ ንጽሕት ወላዲተ ኣምላክ ድንግል ኅትምት ወለድኪ ለነ ቃለአብ ኢየሱስ ክርስቶስ መጽአ ለመድኃኒትነ፡ ሰአሊ ለነ ቅድስት።", "page": 26, "label": "ኮንኪ"}, {"n": 13, "text": "አንቲ እሙ ለብርሃን ክብርት ወላዲት እግዚእ እንተ ፃርኪያ ለቃል ዘኢይትረአይ፡ እምድኅረ ወለድኪ ኪያሁ ነበርኪ በድንግልና፡ በስብሐት ወበባርኮት ያዐብዩኪ፡ ሰአሊ ለነ ቅድስት።", "page": 26, "label": "አንቲ"}, {"n": 14, "text": "አይ ልሳን ዘይክል ነቢበ ዘይትነገር በእንቲአኪ ኦ ድንግል ንጽሕት እሙ ለቃለ ኣብ ኮንኪ መንበሮ ለንጉሥ ለዘይፀዉርዎ ኪሩቤል፡ ናስተበፅዐኪ ኦ ቡርክት፡ወንዘክር ስመኪ በኩሉ ትዉልደ ትዉልድ ኦ ርግብ ሠናይት እሙ ለእግዚእነ ኢየሱስ ክርስቶስ፡ ሰአሊ ለነ ቅድስት።", "page": 27, "label": "አይ"}, {"n": 15, "text": "ተፈሥሒ ኦ ማርያም እም ወአመት፡ እስመ ለዘዉስተ ሕፅንኪ ይሰብሕዎ መላእክት ወኪሩቤል ይሰግዳ ሎቱ በፍርሃት፡ ወሱራፌል ዘእንበለ ጽርዓት ይሰፍሑ ክነፈሆሙ ወይብሉ፡ ዝንቱ ዉእቱ ንጉሠ ስብሐት መጽአ ይሥረይ ኃጢአተ ዓለም በዕበየ ሣህሉ ፡ ሰኣሊ ለነ ቅድስት፡፡", "page": 27, "label": "ተፈሥሒ"}], "weekd ለኮቱ ኢተወለጠ ኮነ ወልደ ዕጓለ እመሕያዉ አምላክ ዘበአማን መጽአ ወአድኃነነ፡ ሰአሊ ለነ ቅድስት።", "page": 38, "label": "ዕፀ"}, {"n": 2, "text": "ናዐብየኪ ኩልነ ኦ እግዝእትነ ወላዲተ አምላክ እስመ ሣህልኪ ይኩን ላዕለ ኩልነ።ትምክሕተ ኩልነ ድንግል ማርያም ወላዲተ አምላክ ዘበእንቲአሃ ተሥዕረ ዘቀዳሚ መርገም እንተ ኃደረት ዲበ ዘመድነ፡ በዕልወት ዘገብረት ብእሲት በልዐት እምዕፅ፡ በእንተ ሔዋን ተዐፅወ ኆኅተ ገነት፡ ወበእንተ ማርያም ድንግል ተርኅወ ለነ ዳግመ፡ ከፈለነ ንብላዕ እምዕፀ ሕይወት፡ ዘዉእቱ ሥጋሁ ለክርስቶስ ወደሙ ክቡር፡ በእንተ ፍቅረ ዚአነ መፅአ ወአድኃነነ፡ አይ ልቡና፡ ወአይ ነቢብ፡ ወአይ ሰሚዕ፡ ዘይክል አእምሮ ዝንቱ ምሥጢር መንክራተ ዘይትነበብ ላዕሌሃ፡ እግዚአብሔር መፍቀሬ ሰብእ ፩ዱ ዉእቱ ባሕቲቱ ቃለ አብ ዘሀሎ እምቅድመ ዓለም በመለኮቱ፡ እንበለ ሙስና እም፩ዱ አብ መጽአ ወተሰብአ ወልድ ዋሕድ እምቅድስት እሙ፡ እምድኅረ ወለደቶ ኢማሰነ ድንግልናሃ፡ ወበእንተዝ ግህደ ኮነት ከመ ወላዲተ ኣምላክ ይእቲ፡ ኦ ዕሙቅ ብዕለ ጥበቡ ለእግዘአብሔር ከርሥ ዘፈትሐ ላዕሌሃ ትለድ በፃዕር ወሕማም ወኃዘነ ልብ፡ወኮነት ፈልፈለ ሕይወት ወወለደት ዘእንበለ ዘርአ ብእሲ ዘይስዕር መርገመ እምዘመድነ። ወበእንተዝ ንሰብሖ እንዘ ንብል ስብሐት ለከ ኦ መፍቀሬ ሰብእ ኄር ወመድኃኔ ነፍሳቲነ፡ ሰአሊ ለነ ቅድስት።", "page": 39, "label": "ናዐብየኪ"}, {"n": 3, "text": "ኦ ዝ መንክር ወዕፁብ ኃይለ ከርሣ ለድንግል ወላዲተ አምላክ ዘእንበለ ዘርእ ስምዐ ኮነ መልአክ ዘአስተርአዮ ለዮሰፍ እንዘ ይብል ከመዝ፡ እስመ ዘይትወለድ እምኔሃ እመንፈስ ቅዱስ ቃለ እግዚአብሔር ዉእቱ ተሰብኣ ዘእንበለ ዉላጤ፡ ወለደቶ ማርያም ምክዕቢተ ዝንቱ ፍሥኃ፡ ወይቤ ትወልዲ ወልደ ወይሰመይ አማኑኤል ዘበትርጓሜሁ እግዚኣብሔር ምስሌነ፡ ወዓዲ ይሰመይ ኢየሱስሃ ዘያድኅኖሙ ለሕዝቡ እምኃጢአቶሙ ያድኅነነ በኃይሉ ወይሥረይ ኃትጥያተነ እስመ ጥዩቀ አእመርናሁ ከመ አምላክ ዉእቱ፡ ዘኮነ ሰብአ ሎቱ ስብሐት እስከ ለዓለም፡ ኦዝ መንክር ልደተ አምላክ እማርያም እምቅድስት ድንግል፡ ኣግመረቶ ለቃል ኢቀደሞ ዘርእ ለልደቱ ወኢአማሰነ በልደቱ ድንግልናሃ፡ እምኀበ አብ ወፅአ ቃል ዘእንበለ ድካም፡ ወእምድንግል ተወልደ ዘእንበለ ሕማም፡ ሎቱ ሰገዱ ሰብአ ሰገል፡ አምጽኡ ዕጣነ ከመ ኣምላክ ዉእቱ፡ ወርቀ እስመ ንጉሥ ዉእቱ፡ ወከርቤ ዘይትወሀብ ለሞቱ ማሕየዊ በእንቲኣነ ተወክፈ በፈቃዱ፡ አሀዱ ዉእቱ ባሕቲቱ ኄር ወመፍቀሬ ሰብእ፡ ሰአሊ ለነ ቅድስት።", "page": 41, "label": "ኦ"}, {"n": 4, "text": "ኦዝ መንክር ነሥአ አሐደ ዐፅመ እምገቦሁ ለአዳም ወለሐኰ እምኔሁ ብእሲተ ወኩሎ ፍጥረተ ዕጓለ እመሕያዉ፡ ተዉህበ እግዚእ ቃለ አብ ተሰብአ እምቅድስት ድንግል ወተሰምየ ኣማኑኤል ወበእንተዝ ንስአል ኀቤሃ ኩሎ ጊዜ ከመ ታስተሥሪ በእንቲአነ ኀበ ፍቁር ወልዳ፡ ኄርት ይእቲ በኀበ ኩሎሙ ቅዱሳን ወሊቃነ ጳጳሳት እስመ ኣምጽአት ሎሙ ዘኪያሁ ይጸንሑ፡ ወለነብያትኒ ኣምጽአት ሎሙ ለዘበእንቲኣሁ ተነበዩ፡ ወለሐዋርያትኒ ወለደት ሎሙ ዘሰበኩ በስሙ ዉስተ ኩሉ ኣጽናፈ ዓለም፡ ለሰማዕት ወለመሃይምናን ወፅአ እምኔሃ ዘተጋደሉ በእንቲአሁ ክርስቶስ ብዕለ ጸጋ ጥበቡ ዘኢይትዐወቅ፡ንኅሥሥ ዕበየ ሣህሉ መጽአ ወአድኃነነ፡ ሰአሊ ለነ ቅድስት።", "page": 43, "label": "ኦዝ"}, {"n": 5, "text": "መሐለ እግዚኣብሔር ለዳዊት በጽድቅ ወኢይኔስሕ፡ እስመ እምፍሬ ከርሥከ አነብር ዲበ መንበርከ፡ወሶበ ተወክፎ ዉእቱ ጻድቅ ከመ እምኔሁ ይትወለድ ክርስቶስ በሥጋ፡ ፈቀደ ይኅሥሥ ወይርከብ ማኅደሮ ዘእግዚአብሔር ቃል ወፈጸመ ዘንተ በዐቢይ ትጋህ፡ ወእምዝ ጸርሐ በመንፈስ ወይቤ፡ ናሁ ሰማዕናሁ በኤፍራታ ወማኅደሮ ለአምላከ ያዕቆብ፡ እንተ ይእቲ ቤተልሔም ዘኀረያ አማኑኤል ይትወለድ ዉስቴታ በሥጋ ለመድኃኒተ ዚአነ፡ ካዕበ ይቤላ ካልእ እምነብያት ወአንቲኒ ቤተልሔም ምድረ ኤፍራታ ኢትቴሐቲ እምነገሥተ ይሁዳ፡ እስመ እምኔኪ ይወፅእ ንጉሥ ዘይርዕዮሙ ለሕዝብየ እስራኤል፡ ኦዝ ነገር ለእሉ እለ ተነበዩ ዘበአ፩ዱ መንፈስ በእንተ ክርስቶስ ሎቱ ስብሓት፡ ምስለ ኄር አቡሁ፡ ወመንፈስ ቅዱስ እምይእዜ ወእስከ ለዓለም፡ ሰአሊ ለነ ቅድስት።", "page": 44, "label": "መሐለ"}, {"n": 6, "text": "ዳዊት ዘነግሠ ለእስራኤል አመ ይትነሥኡ ላዕሌሁ ዕልዋን። ፈትወ ይስተይ ማየ እምዓዘቅተ ቤተልሔም፡ ፍጡነ ተንሥኡ መላሕቅተ ሐራሁ ወተቃተሉ በዉስተ ትዕይንተ ዕልዋን፡ ወአምጽኡ ሎቱ ዉእተ ማየ ዘፈተወ ይስተይ፡ወሶበ ርእየ ዉእቱ ጻድቅ ከመ አጥብዑ ወመጠዉ ነፍሶሙ ለቀትል በእንቲ አሁ፡ ከዐወ ዉእተ ማየ ወኢሰትየ እምኔሁ፡ ወእምዝ ተኈለቈ ሎቱ ጽድቅ እስከ ለዓለም፡ አማን መነኑ ሰማዕት ጣዕማ ለዛ ዓለም ወከዓዉ ደሞሙ በእንተ እግዚኣብሔር ወተዐገሡ ሞተ መሪረ በእንተ መንግሥተ ሰማያት፡ ተሣሃለነ በከመ ዕበየ ሣህልከ፡ ሰአሊ ለነ ቅድስት።", "page": 46, "label": "ዳዊት"}, {"n": 7, "text": "ኣሐዱ ዘእምቅድስት ሥላሴ፤ ርእዮ ትሕትናነ አጽነነ ሰማየ ሰማያት፡ መጽአ ወኀደረ ዉስተ ከርሠ ድንግል፡ ወኮነ ሰብአ ከማነ ዘእንበለ ኃጢአት ባህቲታ፡ ወተወልደ በቤተ ልሔም በከመ ሰበኩ ነቢያት፡ አድኃነነ ወቤዘወነ ወረሰየነ ሕዝበ ዚአሁ፡ ሰአሊ ለነ ቅድስት።", "page": 47, "label": "ኣሐዱ"}], "weekday": 4}, {"id": "widase_6", "title": "ውዳሴ ዘዓርብ", "en": "Friday", "page": 48, "intro": "ውዳሴሃ ለእግዝእትነ ማርያም ድንግል ወላዲተ አምላክ ዘይትነበብ በዕለተ ዓርብ።", "items": [{"n": 1, "text": "ቡርክት አንቲ እምአንስት ወቡሩክ ፍሬ ከርሥኪ፡ ኦ ማርያም ድንግል ወላዲተ አምላክ ዘእንበለ ርኩስ ሠረቀ ለነ እምኔኪ ፀሐየ ጽድቅ፡ ወአቅረበነ ታሕተ ክነፍሁ እስመ ዉእቱ ፈጠረነ፡ ሰአሊ ለነ ቅድስት።", "page": 48, "label": "ቡርክት"}, {"n": 2, "text": "ለኪ ለባሕቲትኪ ኦ እግዚእትነ ወላዲተ አምላክ እመ ብርሃን አንቲ ናዐብየኪ በስብሐት ወበዉዳሴ። ቡርክት አንቲ ተዐቢዪ እምሰማይ ወትከብርይ እምድር ወላዕለ ኩሉ ሕሊናት፡ መኑ ዘይክል ነቢበ ዕበየኪ፡ ወአልቦ ዘይመስል ኪያኪ፡ ኦ ማርያም መላእክት ያዐብዩኪ ወሱራፌል ይሴብሑኪ፡ እስመ ዘይነብር ዲበ ኪሩቤል ወሱራፌል መጽአ ወኀደረ ዉስተ ከርሥኪ፡ መፍቀሬ ሰብእ አቅረበነ ኀቤሁ፡ ዘዚአነ ሞተ ነሥአ ወእንቲአሁ ሕይወተ ወሀበነ፡ ዘሎቱ ክብር ወስብሐት፡ ሰአሊ ለነ ቅድስት።", "page": 48, "label": "ለኪ"}, {"n": 3, "text": "ቡርክት አንቲ ማርያም ወቡሩክ ፍሬ ከርሥኪ ኦ ድንግል ወላዲተ አምላክ ምክሖን ለደናግል፡ ዘእምቅድመ ዓለም ህልዉ ተሰብአ እምኔኪ ብሉየ መዋዕል ወፅአ እምከርስኪ ሥጋነ ነሥአ ወመንፈሶ ቅዱሰ ሀቤነ፡ ወረሰየነ ዕሩያነ ምስሌሁ በብዝኃ ኂሩቱ፡ አንቲ ተዐቢዪ እምብዙኃት አንስት እለ ነሥአ ጸጋ ወክብረ፡ ኦ ማርያም ወላዲተ አምላክ ሀገር መንፈሳዊት ዘኀደረ ላዕሌሃ እግዚአብሔር ልዑል፡ እስመ ዘይነብር ዲበ ኪሩቤል ወሱራፌል በእራኅኪ ሐቀፍኪዮ፡ ወዘይሴሲ ለኩሉ ዘሥጋ በብዝኃ ኂሩቱ አኀዘ አጥባተኪ ወጠበወ ሕሊበ፡ ዘዉእቱ አምላክነ መድኃኔ ኩሉ ይርዕየነ እስከ ለዓለም፡ ንስግድ ሎቱ ወንሰብሖ እስመ ዉእቱ ፈጠረነ፡ ሰአሊለነ ቅድስት።", "page": 50, "label": "ቡርክት"}, {"n": 4, "text": "ማርያም ድንግል ሙዳየ ዕፍረት ነቅዐ ፈልፈለ ማየ ሕይወት፡ፍሬ ከርሣ አድኃነ ኩሎ ዓለመ ወሠዐረ እምኔነ መርገመ፡ ወገብረ ሰላመ ማእከሌነ በመስቀሉ ወበትንሣኤሁ ቅድስት፡ አግብኦ ለብእሲ ዳግመ ዉስተ ገነት፡ ሰአሊለነ ቅድስት።", "page": 51, "label": "ማርያም"}, {"n": 5, "text": "ማርያም ንጽሕት ድንግል ወላዲተ አምላክ ማእምንት፡ ሰአሊተ ምሕረት ለዉሉደ ሰብእ ሰአሊ ለነ ኀበ ክርስቶስ ወልድኪ ይሥረይ ኃጢአተነ፡ ሰአሊ ለነ ቅድስት።", "page": 51, "label": "ማርያም"}, {"n": 6, "text": "ማርያም ድንግል ትጸርሕ በቤተ መቅደስ ወትብል የአምር እግዚአብሔር ከመ አልብየ ዘአአምር ባዕደ ወኢምንትኒ ዘእንበለ ድምፀ ቃሉ ለመልአክ ዘአብሠረኒ በክብር፡ ወይበለኒ ሰላም ለኪ ኦ ቅድስት ድንግል፡ ፆርኪ ዘኢይትፀወር፡ አግመርኪ ዘይትገመር ወአልቦ ዘያገምሮ ምንትኒ፡ ይበዝኅ ዉዳሴኪ ኦ ምልእተ ጸጋ በኩሉ ክብር፡ እስመ ኮንኪ አንቲ ማሕደረ ቃለ አብ፡አንቲ ዉእቱ መንጦላዕት ስፍህት እንተ ታስተጋብኦሙ ለመሃይምናን ሕዝበ ክርስቲያን ወትሜህሮሙ ሰጊደ ለሥሉስ ማሕየዊ፡ አንቲ ዉእቱ ዘፆርኪ ዓምደ እሳት ዘርእየ ሙሴ ዘዉእቱ ወልደ እግዚአብሔር መጽአ ወኀደረ ዉስተ ከርሥኪ፡ ኮንኪ ታቦቶ ለፈጣሬ ሰማያት ወምድር፡ ፆርኪዮ በከርሥኪ ፱ተ አዉራኃ፡ አንቲ ማእምንት ለዘኢያገምርዎ ሰማያት ወምድር፡ ኮንኪ ተንከተመ ለዕርገት ዉስተ ሰማይ፡ ብርሃንኪ የዐቢ እምብርሃነ ፀሐይ፡ አንቲ ዉእቱ ምስራቅ ዘወፅአ እምኔኪ ኮከብ ብሩህ ዘነፀርዎ ቅድሳን በፍሥሓ ወበኃሤት፡ ዘፈትሐ ላዕለ ሔዋን ትለድ በፃዕር ወሕማም፡ አንቲሰ ማርያም ሰማዕኪ ዘይብል ተፈሥሒ ኦ ምልእተ ጸጋ፡ ወለድኪ ለነ ንጉሠ እግዚአ ኩሉ ፍጥረት መጽአ ወአድኀነነ መሐሪ ዉእቱ ወመፍቀሬ ሰብእ፡ በእንተዝ ንዌድሰኪ በከመ ገብርኤል መልአክ እንዘ ንብል፡ ቡርክት አንቲ ማርያም ወቡሩክ ፍሬ ከርሥኪ ተፈሥሒ ኦ ምልእተ ጸጋ እግዚአብሔር ምስሌኪ ሰአሊ ለነ ቅድስት።", "page": 52, "label": "ማርያም"}], "weekday": 5}, {"id": "widase_7", "title": "ውዳሴ ዘቀዳሚት ሰንበት", "en": "Saturday", "page": 55, "intro": "ዉዳሴሃ ለእግዚእትነ ማርያም ድንግል ወላዲተ አምላክ ዘትነበብ በዕለተ ቀዳሚት ሰንበት።", "items": [{"n": 1, "text": "ንጽሕት ወብርሕት ወቅድስት በኩሉ እንተ ሐቀፈቶ ለእግዚእ በእራኃ ወኩሉ ፍጥረት ይትፌሥሑ ምስሌሃ እንዘ ይጸርሑ ወይብሉ፡ ሰአሊለነ ቅድስት።", "page": 55, "label": "ንጽሕት"}, {"n": 2, "text": "ተፈሲሒ ኦ ምልእተ ጸጋ፡ ተፈሥሒ እስመ ረከብኪ ሞገሰ፡ ተፈሥሒ እግዚአብሔር ምስሌኪ። ናስተበፅዕ ዕበየኪ ኦ ግርምት ድንግል፡ ወንፌኑ ለኪ ፍሥሐ ምስለ ገብርኤል መልአክ፡ እስመ እምፍሬ ከርሥኪ ኮነ መድኃኒተ ዘመድነ፡ ወአቅረበነ ኀበ እግዚአብሔር አቡሁ፡ ሰአሊ ለነ ቅድስት።", "page": 55, "label": "ተፈሲሒ"}, {"n": 3, "text": "ከመ ከብካብ ዘአልቦ ጥልቀት፡ መንፈስ ቅዱስ ኀደረ ላዕሌኪ ወኃይለ ልዑል ጸለለኪ፡ ኦ ማርያም አማን ወለድኪ ቃለ ወልደ አብ ዘይነብር ለዓለም መጽአ ወአድኀነነ እምኃጢአት፡ ሰአሊ ለነ ቅድስት።", "page": 56, "label": "ከመ"}, {"n": 4, "text": "አንቲ ዉእቱ ዘመድ ዘእምሥርወ ዳዊት ወለድኪ ለነ በሥጋ መድኃኒነ ኢየሱስ ክርስቶስ፡ ዋሕድ ቃል ዘእምአብ ዘእምቅድመ ዓለም ህቡዕ፡ ኀብአ ርእሶ ወነሥአ እምኔኪ አርአያ ገብር፡ ሰአሊ ለነ ቅድስት።", "page": 56, "label": "አንቲ"}, {"n": 5, "text": "ኮንኪ ዳግሚተ ሰማይ ዲበ ምድር ኦ ወላዲተ አምላክ ዘእንበለ ርኩስ፡ ሠረቀ ለነ እምኔኪ ፀሐየ ጽድቅ፡ ወወለድኪዮ በከመ ትንቢት ነቢያት ዘእንበለ ዘርእ ወኢሙስና፡ ሰአሊ ለነ ቅድስት።", "page": 57, "label": "ኮንኪ"}, {"n": 6, "text": "አንቲ ዉእቱ ደብተራ እንተ ተሰመይኪ ቅድስተ ቅዱሳን፡ ወወስቴታ ታቦት በወርቅ ልቡጥ እምኩለሄ ወውስቴታ ጽላተ ኪዳን ወመሶበ ወርቅ እንተ መና ኅቡእ፡ ዘዉእቱ ወልደ እግዚአብሔር መጽአ ወኀደረ ኀበ ማርያም ድንግል፡ ዘእንበለ ርኩስ ተሰብአ እምኔሃ ቃለ አብ ወወለደቶ ዉስተ ዓለም ለንጉሠ ስብሐት፡ መጽአ ወአድኀነነ፡ ትትፌሣሕ ገነት እመ በግዕ ነባቢ፡ ወልደ አብ ዘይነብር ለዓለም፡ መጽአ ወአድኀነነ እም ኃጢአት፡ ሰአሊ ለነ ቅድስት።", "page": 57, "label": "አንቲ"}, {"n": 7, "text": "ተሰመይኪ እመ ለክርስቶስ ንጉስ፡ እምድኅረ ወለድኪ ኪያሁ ነበርኪ በድንግልና በመንክር ምሥጢር ወወለድኪዮ ለአማኑኤል፡ ወበእንተዝ ዐቀበኪ እንበለ ሙስና፡ ሰአሊ ለነ ቅድስት።", "page": 58, "label": "ተሰመይኪ"}, {"n": 8, "text": "አንቲ ዉእቱ ሰዋስዉ ዘርእየ ያዕቆብ እግዚአብሔር ላዕሌሁ እስመ ፆርኪ በከርሥኪ ኅቱም ዘኢይትዓወቅ እምኩለሄ፡ ኮንኪ ለነ ሰአሊተ ኀበ እግዚእነ ኢየሱስ ክርስቶስ ዘተሰብአ እምኔኪ በእንተ መድኃኒትነ፡ ሰአሊ ለነ ቅድስት።", "page": 58, "label": "አንቲ"}, {"n": 9, "text": "ናሁ እግዚእ ወፅአ እምኔኪ ኦ ቡርክት ጽርሕ ንጽህት፡ ያድኅን ኩሎ ዓለመ ዘፈጠረ በዕበየ ሣህሉ ንሰብሖ ወንወድሶ እስመ ዉእቱ ኄር ወመፍቀሬ ሰብእ፡ ሰአሊ ለነ ቅድስት::", "page": 59, "label": "ናሁ"}, {"n": 10, "text": "ተፈሥሒ ኦ ምልእተ ጸጋ ድንግል ዘእንበለ ርኩስ ልሕኩት ንጽሕት ክብረ ኩሉ ዓለም፡ ብርሃን ዘኢትጠፍእ፡ መቅደስ ዘኢትትነሠት፡ በትረ ሃይማኖት ዘኢትጸንን፡ ምስማኮሙ ለቅዱሳን፡ ሰአሊ ለነ ኀበ ወለድኪ ኄር መድኃኒነ ይምሐረነ ወይሣሃለነ ይሥረይ ኃጢአተነ፡ ሰአሊ ለነ ቅድስት።", "page": 59, "label": "ተፈሥሒ"}], "weekday": 6}, {"id": "widase_8", "title": "ውዳሴ ዘሰንበት ክርስቲያን", "en": "Sunday", "page": 60, "intro": "ውዳሴሃ ለእግዝእትነ ማርያም ድንግል ወላዲተ አምላክ ዘይትነበብ በዕለተ ሰንበት ክርስቲያን ቅድስት።", "items": [{"n": 1, "text": "ተሰመይኪ ፍቅርተ ኦ ቡርክት እምአንስት አንቲ ዉእቱ ዳግሚት ቀመር እንተ ተሰመይ ቅድስተ ቅዱሳን ወዉስቴታ ጽላተ ኪዳን፡፲ቱ ቃላት እለ ተጽሕፋ በአፃብዒሁ ለእግዚአብሔር ቀዲሙ ዜነወነ በየዉጣ እንተ ይእቲ ቀዳሜ ስሙ ለመድኃኒነ ኢየሱስ ክርስቶስ ዘተሰብአ እምኔኪ ዘእንበለ ዉላጤ፡ወኮነ ዓራቄ ለሐዲስ ኪዳን፡ በዉኂዘ ደሙ ቅዱስ አንጽሖሙ ለመሃይምናን ወለሕዝብ ንጹሐን፡ ሰአሊ ለነ ቅድስት። ወበእንተዝ ናዐብየኪ ኩልነ፡ ኦ እግዝእትነ ወላዲተ አምላክ ንጽሕት ኩሎ ጊዜ ንስእል ወናንቀዐዱ ኀቤኪ፡ ከመ ንርከብ ሣህለ በኀበ መፍቀሬ ሰብእ።", "page": 60, "label": "ተሰመይኪ"}, {"n": 2, "text": "ታቦት በወርቅ ልቡጥ እምኩለሄ ዘግቡር እምዕፅ ዘኢይትቅዝ ይትሜሰል ለነ ዘእግዚአብሔር ቃለ ዘኮነ ሰብአ ዘእንበለ ፍልጠት ወኢዉላጤ፡ መለኮት ንጹሕ ዘአልቦ ሙስና ዘዕሩይ ምስለ አብ ወቦቱ አብሠራ ለንጽሕት፡ ዘእንበለ ዘርእ ኮነ ከማነ በኪነ ጥበቡ ቅዱስ፡ ዘተሰብአ እምነኪ ዘእንበለ ርኩስ፡ ደመረ መለኮቶ፡ ሰአሊ ለነ ቅድስት።", "page": 61, "label": "ታቦት"}, {"n": 3, "text": "መቅደስ ዘይኬልልዋ ኪሩቤል እለ ሥዑላን በሥዕለ እግዚአብሔር፡ ቃል ዘተሰብአ እምኔኪ ኦ ንጽሕት ዘእንበለ ዉላጤ ኮነ ሠራዬ ኃጥአትነ ወደምሳሴ አበሳነ፡ ሰአሊ ለነ ቅድስት።", "page": 62, "label": "መቅደስ"}, {"n": 4, "text": "አንቲ ዉእቱ መሶበ ወርቅ ንፁሕ እንተ ዉስቴታ መና ኅቡእ፡ ኅብስት ዘወረደ እምሰማያት ወሀቤ ሕይወት ለኩሉ ዓለም፡ ሰአሊ ለነ ቅድስት።", "page": 62, "label": "አንቲ"}, {"n": 5, "text": "እንቲ ዉእቱ ተቅዋም ዘወርቅ እንተ ፆርኪ ማኅቶተ ፀዳል ኩሎ ጊዜ፡ ዘዉእቱ ብርሃኑ ለዓለም፡ ብርሃን ዘእምብርሃን ዘአልቦ ጥንት፡ አምላክ ዘእምአምላክ ዘበአማን፡ ዘተሰብአ እምኔኪ ዘእንበለ ዉላጤ፡ ወበምጽአቱ አብርሃ ላዕሌነ ለእለ ንነብር ዉስተ ጽልመት ወጽላሎቱ ሞት፡ ወአርአትዐ እገሪነ ዉስተ ፍኖተ ሰላም በምሥጢረ ጥበቡ ቅዱስ፡ ሰአሊ ለነ ቅድስት።", "page": 63, "label": "እንቲ"}, {"n": 6, "text": "አንቲ ዉእቱ ማዕጠንት ዘወርቅ፡ እንተ ፆርኪ ፍሕመ እሳት፡ ብሩክ ዘነሥአ እመቅደስ ዘይሠሪ ኃጢአተ ወይደመሰስ ጌጋየ፡ ዝ ዉእቱ ዘእግዚአብሔር ቃል ዘተሰብአ እምነኪ ዘአዕረገ ለአቡሁ ርእሶ ዕጣነ ወመሥዋዕተ ሥሙረ፡ ሰአሊ ለነ ቅድስት።", "page": 63, "label": "አንቲ"}, {"n": 7, "text": "ተፈሥሒ ኦ ማርያም ርግብ ሠናይት፡ ዘወለድኪ ለነ ዘእግዚአብሔር ቃለ፡ አንቲ ዉእቱ ጽጌ መዓዛ ሠናይ እንተ ሠረፀት እምሥርወ ዕሤይ፡ ሰአሊ ለነ ቅድስት።", "page": 64, "label": "ተፈሥሒ"}, {"n": 8, "text": "በትረ አሮን እንተ ሠረፀት ዘኢንበለ ተክል ወኢሠቀይዋ ማየ፡ ከማሃ አንቲኒ ኦ ወላዲተ ክርስቶስ አምላክነ ዘበአማን ዘእንበለ ዘርእ መጽአ ወአድኀነነ፡ ሰአሊ ለነ ቅድስት።", "page": 64, "label": "በትረ"}, {"n": 9, "text": "ለኪ ይደሉ ዘእምኩሎሙ ቅዱሳን ተስአሊ ለነ ኦ ምልእተ ጸጋ አንቲ ተዐብዪ እምሊቃነ ጳጳሳት ወፈድፋደ ትከብሪ እምነቢያት ብኪ ግርማ ራእይ ዘየዐቢ እምግርማ ሱራፌል ወኪሩቤል፡ አንቲ በአማን ምክሐ ዘመድነ ወሰአሊት ሕይወተ ለነፍሳቲነ ሰአሊ ለነ ኀበ እግዚእነ ወመድኃኒነ ኢየሱስ ክርስቶስ፡ ያፅንዐነ በርትዕት ሃይማኖት ዉስተ አሚነ ዚአሁ፡ ይጸግወነ ሣህሎ ወምሕረቶ፡ ይሥረይ ኃጢአተነ በብዝኃ ምሕረቱ፡ ሰአሊ ለነ ቅድስት። ወበእንተዝ ናዓብየኪ ኩልነ ኦ እግዝእትነ ወላዲተ አምላክ ንጽሕት ኩሎ ጊዜ፡ ንስእል ወናንቀዐዱ ኀቤኪ ከመ ንርከብ ሣህለ በኀበ መፍቀሬ ሰብእ። ጸሎታ ለማርያም ወስእለታ ያድኅነነ እመዓተ ወልዳ።ጸሎታ ለማርያም ወስእለታ ለርእሰ ሊቃነ ጳጳስነ እገሌ ……….ይዕቀቦሙ እመዓተ ወልዳ። ጸሎታ ለማርያም ወስእለታ ለመፍቀሬ አምላክ እገሌ…………… እዕቀቦሙ እመዓተ ወልዳ። ጸሎታ ለማርያም ወስእለታ ለሕዝበ ክርስትያን ይዕቀቦም እብመዓተ ወልዳ። ጸሎታ ለማርያም ወስእለታ ለሀገረትነ ይዕቀባ እመዓተ ወልዳ።", "page": 65, "label": "ለኪ"}], "weekday": 7}]}, {"id": "anqetse", "title": "አንቀጸ ብርሃን", "en": "Anqetse Birhan", "sections": [{"id": "anqetse_1", "title": "አንቀጸ ብርሃን", "en": null, "page": 67, "items": [{"n": 1, "text": "ዉዳሴ ወግናይ ለእመ አዶናይ፡ ቅድስት ወብፅዕት፡ ስብሕት ወቡርክት፡ ክብርት ወልዕልት ዐንቀጸ ብርሃን፡ መዓርገ ሕይወት ወማኅደረ መለኮት ቅድስተ ቅዱሳን፡ አንቲ ዉእቱ ኦ እግዚትነ ወላዲተ አምላክ ማርያም ድንግል፡ ተሰመይኪ ሥምረተ አብ ወማኅደረ ወልድ፡ ወምጽላለ ዘቅዱስ መንፈስ፡ ኦ ብርክት እምክሉ ፍጥረት፡ አንቲ ዉእቱ ህየንተ አርያም ዘበሰማያት ዘኮንኪ አርያመ በዲበ ምድር፡ ብኪ አስተማሰሉ ቅዱሳን ነቢያት፡ ካህናት ወነገሥት፡ ገብሩ ሎሙ ቅድስተ ቅዱሳን፡ ወዉስቴታ ጽላተ ኪዳን፡ ወልድኪ ሣህሎ ይክፍለነ፡ ሰአሊ ለነ ቅድስት።", "page": 67, "label": "ዉዳሴ"}, {"n": 2, "text": "በእንተ ተሠግዎቱ ለወልደ አምላክ እምኔኪ፡ ወብኪ ቅሩባነ ኮነ። ዐሠርቱ ቃላት እለ ተጽሕፋ በአፃብዒሁ ለእግዚአ ኩሉ ፍጥረት፡ ኀደረ ወልደ አምላክ ላዕሌኪ አብ በየማኑ ከደነኪ ወቅዱስ መንፈስ ጸለለኪ ወኃይለ ልዕል አጽንዐኪ፡ ወኢየሱስ ለብሰ ሥጋ ዚአኪ ከልሐ ወይቤ፡ ዘጸምአ ይምጻእ ኀቤየ ወይሰተይ፡ በከመ ይቤ መጽሓፍ አፍላገ ማየ ሕይወት ዘይዉኅዝ እምከርሡ፡ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 68, "label": "በእንተ"}, {"n": 3, "text": "ቀዲሙ ዜነወነ አብ በየውጣ እንተ ይእቲ ዐሠርቱ ቃላት እለ ተጽሕፋ በአፃብዒሁ ለእግዚአብሔር፡ ወመሀረነ ወልድከ እግዚእነ ወመድኃኒነ ኢየሱስ ክርስቶስ፡ ከመ አንተ ባሕቲትከ አቡሁ ሎቱ ወውእቱ ባሕቲቱ ወልድ ለከ፡ ከመዝ ነአምን ዘአልቦቱ እም በሰማያት፡ ወአብ በዲበ ምድር፡ ዘወረደ እምሰማያት እንዘ አልቦ ዘየአምር ምጽአቶ ዘእንበለ አቡሁ ባሕቲቱ ወጴራቅሊጦስ መንፈሰ ጽድቅ፡ ኀደረ ዉስተ ከርሥኪ ወፆርኪዮ ተስዐተ አውራኀ፡ ተፈሥሑ ሰማያት ወተኃሥየት ምድር በልደቱ ለወልድኪ፤ መልአክ ዜነወ ፍሥሓ ወሓራ ሰማይ ሰብሑ እንዘ ይብሉ ''ስብሓት ለእግዚአብሔር በሰማያት፡ ወሰላም በምድር ለዕጓለ እመሕያዉ ሥምረቱ'' ወኖሎት በቤተልሔም አንከሩ እምዘርእዩ ወሰምዑ፡ ሰብአ ሰገል ርእዮሙ ኮከበ መጽኡ እምርኁቅ ብሔር ከመ ይሰግዱ ለወልድኪ ወይግነዩ ለኪ፡ ውእቱ ኮከብ ዘመርሖሙ እምሥራቅ ወአብጽሖሙ እስከ ቤተልሔም ወቆመ መልዕልቴኪ ኀበ ሀሎኪ አንቲ ምስለ ሕፃንኪ፡ ወርእዮሙ እሙንቱ መሰግላን ተፈሥሑ ዐብየ ፍሥሓ፡ ቦኡ ኀቤሁ ወቆሙ ቅድሜሁ ወወድቁ ዲበ ምድር ወሰገዱ ሎቱ፡ ወአርኀዉ መዛግብሆሙ። ወአብኡ ሎቱ አምኃ ወርቀ፡ ከርቤ፡ ወስኂነ፡ ወይቤሉ አምኃ አባእነ ለከ፡ ዕጣነ አቅረብነ ለከ፡ እምዚአከ ለክቡር ስምከ፡ ኦ አምላክነ በእንተ ኃጢአተ ሕዝብከ ከመ ትትወከፍ ስእለቶሙ ወመሥዋዕቶሙ ዘመጻእከ ከመ ትሥረይ ሎሙ ኃጢአቶሙ፡ ወልድኪ ሣህሎ ይክፍለነ፡ ሰአሊ ለነ ቅድስት።", "page": 69, "label": "ቀዲሙ"}, {"n": 4, "text": "አንቲ ዉእቱ ንጽሕት እምንጹሓን፡ድንግል ሕሩይ ዘነበርኪ ውስተ ቤተ መቅደስ ከመ ታቦት ዘግቡር እምዕፅ ዘኢይነቅዝ፡ ሥርግዉ በወርቅ ንጡፍ ወልቡጥ በዕንቊ ባሕርይ ዘየኃቱ ዘብዙኅ ሤጡ፡ከመዝ ነበርኪ ዉስተ ቤተ መቅደስ፡ ወመላእክት ያመጽኡ ወትረ ሲሳየኪ፡ ከመዝ ነበርኪ ዐሠርተ ወክልኤተ ዓመተ እንዘ ትትናዘዚ እምኀበ መላእክት ስቴኪኒ ስቴ ሕይወት ዉእቱ። መብልዕኪኒ ኅብስት ሰማያዊ፡ ዳዊት አቡኪ ዘመረ በመሰንቆ ወኀለየ በመዝሙር እንዘ ይብል በመንፈሰ ትንቢት፡ ስምዒ ወለትየ ወርእዩ ወአፅምዒ እዝነኪ፤ ርስዒ ሕዝበኪ ወቤተ አቡኪ እስመ ፈተወ ንጉሥ ሥነኪ፡ እስመ ዉእቱ እግዚእኪ ወሎቱ ትሰግዲ፡ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 72, "label": "አንቲ"}, {"n": 5, "text": "ገብርኤል መልአክ እመላእክት ንጹሓን ዘአልቦ ሙስና፡ እመላእክት ቀደምት ዘይቀዉም ቅድመ እግዚአ ኩሉ አብሠረኪ ወይቤለኪ ተፈሥሒ ፍሥሕት ኦ ምልእተ ጸጋ እግዚአብሔር ምስሌኪ ቡርክት አንቲ እምአንስት ረከብኪ ሞገሰ በኀበ እግዚአ ኩሉ ወናሁ ትፀንጺ ወትወልዲ ወልደ፡ ወትሰምዪዮ ስሞ ኢየሱስ፡ ዉእቱ ዓቢይ ወይሰመይ ወልደ እግዚአብሔር ልዑል ወይሁቦ እግዚአብሔር አምላክ መንበረ ዳዊት አቡሁ፡ ወይነግሥ ለቤተ ያዕቆብ ለዓለም፡ ወአልቦ ማኅለቅት ለመንግሥቱ፡ መንፈስ ቅዱስ ይመጽእ ላዕሌኪ፡ ወኃይለ ልዕል ይጸልለኪ፡ ዘኒ ይትወለድ እምኔኪ፡ ቅዱስ ዉእቱ ወይሰመይ ወልደ እግዚአ ኩሉ ዘተወልደ እምኔኪ፤ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 73, "label": "ገብርኤል"}, {"n": 6, "text": "አንቲ ዉእቱ ዘኮንኪ ጽርሐ ቅድሳት ወመቅደሰ ቅድስተ ቅዱሳን ወመንጦላዕተ ብርሃን፡ ወመንበረ ስብሐት ዘኢይተረጎም፡ አስተማሰልናኪ ኦ ቅድስት ማርያም በመቅደሰ ቅድስተ ቅዱሳን፡ በእንተ ቅዱስ መንፈስ ዘመጽአ ላዕሌኪ፡ ወኃይለ ልዑል ጸለለኪ፡ ወመንጦላዕተ ብርሃንሰ በእንተ ዘተሠወረ ቃለ አብ ኢየሱስ ክርስቶስ መድኃኒነ ዉስተ ከርሥኪ፡ እግዚአ ኩሉ ዘመልዕልት፡ ዘይሴብሕዎ መላእክት ወሊቃነ መላእክት አጋአዝት ወሥልጣናት ኃይላት ወመናብርት ወመኳንንት። ወሶበ ወለድኪ ወልደኪ በዲበ ምድር በውስተ ጎል ከለሉኪ ኪሩቤል እለ ብዙኃት አዕንቲሆሙ፡ ወሱራፌል እለ ስድስቱ ክነፈሆሙ፡ ወደመናተ ብርሃን ፆርኪ፡ሊቃነ መላእክት ወሠራዊተ መላእክት ወሐራ ሰማይ ቆሙ ቅድሜኪ በፍርሃት ወበረዓድ፡ ወበህየ በካልእ ስብሐት ወደሱኪ ኪሩቤል ወሱራፌል ዘኢኮነ እምስብቲሆሙ ዘዉስተ ሰማያት ወኢ እምስብሐቲሆሙ ዘትካት፣ ወሶበ ርእዩ እግዚኦሙ ዘአስተጋብአ ኩሎ ፍጥረታት እንዘ ይነብር ዉስተ ኅፅንኪ፡ ወዘይሴሲ ለኩሉ ፍጥረት ይጠቡ ሐሊበኪ ከመሕፃን፡ ኅሠሥዎ ውስተ አርያም ወበህየ ረከብዎ ምስለ አቡሁ ወመንፈስ ቅዱስ ከመ ትካት፡ ወሶበ ርእዩ ትሕትናሁ ለእግዚኦሙ አልዐሉ አዕይንቲሆሙ ላዕለ ውስተ አርያም፡ ሰፍሑ ክነፈሆሙ ወሰብሑ ለእግዚኦም እንዘ ይብሉ ስብሐት ለከ እግዚአ ኩሉ በሰማያት፡ ወዓዲ ርአዩኪ በውስተ በዓት ለኪ ለባሕቲትኪ ምስለ ሕፃንኪ ወይቤሉ ሰላም በዲበ ምድር፡ ወሶበ ርእዩ እንዘ ይለብስ ሥጋ ዚአነ ዘነሥአ እምኔኪ ሰገዱ እንዘ ይብሉ ለዕጓለ እመሕያዉ ሠምሮ። ዳዊት ነቢይ ተነበየ በመዝሙር እንዘ ይብል፡ እምሰማይ ሐወፀ እግዚአ ኩሉ ወእምድልዉ ጽርሐ መቅደሱ፡ ወርእየ ኩሎ ደቂቀ ዕጓለ እመሕያዉ፡ ፈተወ ንጉሥ ሥነኪ ወይቤ ዛቲ ይእቲ ምዕራፍየ ለዓለም፡ ዝየ አኃድር እስመ ኀረይክዋ፡ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 74, "label": "አንቲ"}, {"n": 7, "text": "አስተማሰልናኪ ቅድስት ወብፅዕት፤ ስብሕት ወቡርክት፡ ክብርት ወልዕልት በመሶበ ዘወርቅ፡ ዘውስቴታ ኅብስተ ሕይወት ዘወረደ እምሰማያት፡ ወሀቤ ሕይወት ለኩሉ፡ ዘየአምን ኪያሁ ወይበልዕ እምኔሁ በአሚን ወበልብ ሥሙር ምስለ እለ በየማኑ። ውልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 77, "label": "አስተማሰልናኪ"}, {"n": 8, "text": "አንቲ ዉእቱ ተቅዋም ዘወርቅ ዘኢገብራ እደ ኬንያ ዘሰብእ፡ ወኢያኃትዉ ዉስቴታ ማኅቶተ፡ አላ ለሊሁ ብርሃን አብ፡ ብርሃን ዘእምብርሃን፡ መጽአ ኀቤኪ ወነበረ መልዕልቴኪ፡ ወአብርሀ መለኮቱ ወስተ ኩሉ አጽናፈ ዓለም፡ ሰደደ ጽልመተ እምላዕለ ሰብእ፡ ወአድኃነነ ብቃሉ ማሕያዊ እንዘ ይብል፡ አነ ዉእቱ ብርሃኑ ለዓለም፡ እመኑ በብርሃኑ ወአንሶስዉ እንዘ ብክሙ ብርሃን፡ ወልድኪ ሣህሎ ይክፍለነ፡ ሰአሊ ለነ ቅድስት።", "page": 77, "label": "አንቲ"}, {"n": 9, "text": "እግዚአ ኩሉ ዘእም እግዚአ ኩሉ፡ ብርሃን ዘእምብርሃን፡ እግዚእ ዘበአማን፡ ዘእምእግዚአ ኩሉ ዘበአማን፡ ዘተወልደ ወአኮ ዘተገብረ፡ ኅቡር ህላዌሁ ምስለ አቡሁ ዘቦቱ ኩሉ ኮነ፡ ዘበሰማይኒ ወበዘምድርኒ። ዘበእንቲአነ ለሰብእ ወበእንተ መድኃኒትነ ወረደ ወተሠገወ ወተሰብአ እማርያም እምቅድስት ድንግል፡ ወበምጽአቱ አብርሀ ላዕሌነ ወዜነወነ ትፍሥሕተ ወኃሤተ ወአቅወኃሤተ ኀበ አቡሁ ወመርሐነ ፍኖተ ሕይወት ወወሀበነ ሕይወት ዘለዓለም በአሚነ ዙአሁ። ኢሳይያስ ነቢይ እምትእዛዙ ለኢየሱስ አንከረ በትንቢት ወይቤ፡ ብርሃን ትእዛዝከ በዲበ ምድር። ዘካርያስ ካህን አረጋዊ ጻድቅ ወንጹሕ ዘይገብር ትእዛዙ ለእግዚአ ኩሉ፡ አንከረ ወቀደመ፡ ከሠተ አፉሁ ወይቤ፡ በሣህሉ ወበምሕረቱ ለአምላክነ ለዘሐወፀነ እምአርያም፡ ወሠረቀ ከመ ያርእዮሙ ብርሃኖ ለእለ ይነብሩ ዉስተ ጽልመት ወጽላሎተ ሞት፡ ወአርትዐ እገሪነ ዉስተ ፍኖተ ሰላም ከመ ይምሓረነ፡ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 78, "label": "እግዚአ"}, {"n": 10, "text": "ናስተማስለኪ ኦ እግእትነ በማዕጠንት ዘወርቅ ዘዉሰተ እዲዊሆሙ ለሊቃነ ካህናት ሰማያዉያን እለ ይከውኑ ጸሎተ ኩሎሙ ቅዱሳን መሃይማናን እምዲበ ምድር በዉስተ ማዕጠንቶሙ ከማሁ በሲለተ ስምኪ ያዐርጉ ስእለቶሙ ለዕጓለ ዕመሕያዉ ዉስተ ማኅደረ ሥሉስ ቅዱስ አብ ወወልድ ወመንፈስ ቅዱስ፡ ወታስተሥርዩ ኃጢአተ ሕዝብኪ ተበውሐ ለኪ ኢምአብ ወወልድ ወመንፈስ ቅዱስ፡ ከመ ትኩኒ ተንከተመ ለዉሉደ ሰብእ ለሕይወት ዘለዓለም፡ ለኪ ይደሉ ከመ ትኩኒ መድኃኒቶሙ ለማሃይምናን ሕዝብኪ ኦ መድኃኒተ ኩሉ ዓለም፡ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 80, "label": "ናስተማስለኪ"}, {"n": 11, "text": "አንቲ ዉእቱ ዕፅ ቡሩክ፡ ዕፅ ሕይወት ወዕፀ መድኃኒት ህየንተ ዕፀ ሕይወት ዘውስተ ገነት፡ ዘኮንኪ ዕፀ ሕይወት በዲበ ምድር። ፍሬኪኒ ፍሬ ሕይወት ዉእቱ፡ ወዘበልዐ እምኔሁ ሕይወተ ዘለዓለም የሓዩ። ጽጌ አስተርአየ እምኔኪ፡ ዘሠናየ መዓዛ ይምዕዝ በኀበ እለ የአምርዎ ዉስተ ኩሉ አጽናፈ ዓለም፡ ዘበእንቲአሁ ተነበየ ዳዊት በመዝሙር እንዘ ይብል፡ ከርቤ ወሚዓ ወሰሊክ እምነ አልባስኪ፡ ሰሎሞን አብኪ ተነበየ ወይቤ፡ ፄና አንፍኪ ከመ ፄና ስኂን፡ ገነት ዕፁት እኅትየ መርዓት፡ ገነት ዕፁት ዐዘቅት ኅትምት ፍናወ ዚአኪ፡ ገነት ምስለ ፍሬ አቅማሕ፡ ቆዕ ምስለ ናርዶስ፡ ናርዶስ ዘምስለ መጽርይ ቀጺመታት ወቀናንሞስ ምስለ ኩሉ ዕፀወ ሊባኖስ፡ ከርቤ ወዓልዉ ምስለ ኩሉ መቅድመ ዕፍረታት፡ ነቅዐ ገነት ዐዘቅተ ማየ ሕይወት ዘይዉሕዝ እምሊባኖስ፡ ወልድኪ ሣህሎ ይክፍለነ ሰአሊ ለነ ቅድስት።", "page": 81, "label": "አንቲ"}, {"n": 12, "text": "በትረ አሮን እንተ ሠረፀት ዘእንበለ ተክል ወኢሠቀይዋ ማየ በቤተ መቅደስ፡ ወረሰያ ድሉተ ለካህናት፡ ከማሃ አንቲኒ ነበርኪ ዉስተ ቤተ መቅደስ በቅድስና ወበንጽሕ ወወፃእኪ እምቤተ መቅደስ በክብር ወበዓቢይ ፍሥሓ፡ ወሠረፀ እምኔኪ ፍሬ ሕይወት ዘበአማን እግዚእነ ወመድኃኒንነ ኢየሱስ ክርስቶስ፤ ኦ ቅድስት ዘእንበለ ሩካቤ ረከብኪ ወልደ በከመ ተጠየቂዮ ለመልአክ ወይቤሌኪ፡ መንፈስ ቅዱስ ይመጽእ ላዕለኪ ወኃይለ ልዑል ይጼልለኪ፡ ወልድኪ ሣህሎ ይክፈለነ ሰአሊ ለነ ቅድስት።", "page": 83, "label": "በትረ"}, {"n": 13, "text": "ለኪ ይደሉ ለአግብርትኪ ወለአእማትኪ ትስአሊ ለነ ኀበ ወልድኪ፡ ለእለ አመነ በስመ ወልድኪ፡ ኦ ምልእተ ጸጋ፡ ኦ ሙኃዘ ፍሥ ሓ፡  3, "text": "ይቤላ ገብርኤል ሰላም ለኪ፡\nማርያም ድንግል ሰላም ለኪ፡\nወላዲተ አምላክ ሰላም ለኪ፡\nማርያም ቅድስት ሰላም ለኪ፡\nማርያም ዉድስት ሰላም ለኪ፡\nማርያም ፍሥሕት ሰላም ለኪ፡\nማርያም ብፅዕት ሰላም ለኪ፡\nማርያም ቡርክት ሰላም ለኪ፡\nማኅደረ መለኮት ሰላም ለኪ፡\nደብተራ ፍጽምት ሰላም ለኪ፡\nእኅተ መላእክት ሰላም ለኪ፡\nወእመ ኩሉ ሕዝብ ሰላም ለኪ፡\nእግዚእትነ ማርያም ሰላም ለኪ፡\nሰላማዊት ሰላም ለኪ፡\nቀደሰኪ ለማህደሩ ልዑል ሰላም ለኪ፡\nአብደረኪ ወኅረየኪ ከመ ትኩኒዮ ማኅደሮ ሰላም ለኪ፡\nበአልባሰ ወርቅ ዑፅፍት ወኁብርት ሰላም ለኪ።\nክንፈ ርግብ በቡሩር ዘግቡር ሰላም ለኪ፡\nወገበዋቲሃኒ በሐመልማለ ወርቅ ማርያም ሥርጉት ሰላም ለኪ፡\nኆኅተ ምሥራቅ ወእሙ ለብርሃን ሰላም ለኪ፡\nትበርሂ እምፀሓይ ወትትሌዐሊ እምአድባር ሰላም ለኪ፡\nማርያም ኅርት ወክብርት ሰላም ለኪ፡", "page": 89, "label": "ይቤላ"}, {"n": null, "text": "ሰአሊ ለነ ኀበ እግዚእነ ወመድኃኒነ ኢየሱስ ክርስቶስ፡ ከመ ያድኅነነ እመ ይመጽእ በስብሐተ አቡሁ ምስለ መላእክቲሁ ቅዱሳን፡ እመ ያቀዉም አባግዐ በየማኑ ወአጣሌ በፀጋሙ፡ ያቁመነ በየማኑ ምስለ እስጢፋኖስ ሰማዕት ወዮሓንስ መጥምቅ።ወምስለ ኩሎሙ ቅዱሳን ወሰማዕት ለዓለመ ዓለም አሜን። ጸሎታ ለማርያም ወስእለታ ያድኅነነ እመዓተ ወልዳ፡ጸሎታ ለማርያም ወስእለታ ለርእሰ ሊቃነ ጳጳስነ እገሌ……ይዕቀቦ እመዓተ ወልዳ፡ ጸሎታ ለማርያም ወስእለታ ለመፍቀሬ አምላክ…….ይዕቀቦሙ እመዓተ ወልዳ፡ ጸሎታ ለማርያም ወስእለታ ለሕዝበ ክርስቲያን ይዕቀቦሙ እመዓተ ወልዳ፡ ጸሎታ ለማርያም ወስእለታ ለሀገሪትነ ኢትዮጵያ ይዕቀቦሙ እመዓተ ወልዳ።", "page": 91}]}]}, {"id": "melka_mariam", "title": "መልክአ ማርያም", "en": "Melke'a Mariam", "sections": [{"id": "melka_mariam_1", "title": "መልክአ ማርያም", "en": null, "page": 93, "items": [{"n": 1, "text": "ማርያምሰ ኃርየት መክፈልተ ሠናየ ዘኢየኅይድዋ ይእቲ ፀዓዳ ዘእምነገደ ይሁዳ ሠረገላተ አሚናዳብ ንብረታ። በኅዳር ጽዮን “ሙሴኒ ይቤላ” በል።", "page": 93, "label": "ማርያምሰ"}, {"n": 2, "text": "ሰላም ሰላም ለዝክረ ስምኪ ሐዋዝ፡ እምነ ከልበኔ ወቍስጥ ወእምነ ሰንበልት ምዑዝ፡ ማርያም ድንግል ለብሲተ ዐቢይ ትእዛዝ፡ ይሥቅየኒ ለለጽባሑ ወይነ ፍቅርኪ አዚዝ፡ ከመ ይሠቅዮ ዉኂዝ ለሠናይ አርዝ።", "page": 93, "label": "ለዝክረ ስምኪ"}, {"n": 3, "text": "ሰላም ለሥዕርተ ርእስኪ ዘተንእደ ፅፍሮሁ፡ ለአቡኪ በከናፍሪሁ፡ ማርያም ድንግል ለእግዚአብሔር ጽርሑ፡ ለገብርኪ እግዚእትየ ኢትኅድግኒ እላሁ፡ ከመ ኢይበሉኒ ፀር አይቴኑመ ምክሑ።", "page": 93, "label": "ለሥዕርተ ርእስኪ"}, {"n": 4, "text": "ሰላም ለርእስኪ በቅብዐ ቅዳሴ ርሑስ፡ አኮ አኮ በቅብዐ ደነስ፡ ማርያም ድንግል ንጽሕተ ሥጋ ወነፍስ፡ ያንጽሓኒ እምነ ርኩስ በፍሕመ ቍርባኑ ቅዱስ፡ አዝዚዮ ለሱራፊ ዘሰማይ ቀሲስ።", "page": 94, "label": "ሰላም ለርእስኪ"}, {"n": 5, "text": "ሰላም ለገጽኪ ዘጥቀ ይልሂ፡ እምሥነ ከዋክብት ወወርኅ ወእምሥነ ፀሐይ መብርሂ፡ ማርያም ድንግል ፍናዋትየ ሠርኂ፡ በመዓልት ወበሌሊት ኢይርከበኒ ጸናሒ፡ መሥገርተ አበሳ ዘይጠፍር ወግበ ዘይደሂ።", "page": 94, "label": "ለገጽኪ"}, {"n": 6, "text": "ሰላም ለቀራንብትኪ ደመናተ ብካይ እለ ኮና፡ ከመ አመ አሕመመ ወልደኪ ቅንአተ ቀያፍ ወሐና፡ ማርያም ድንግል ለባሲተ ንጽሕ ወቅድስና፡ አስምዕኒ ነገረ ጽድቅ ዘያስተፌሥሕ ሕሊና፡ ከመ አስተፍሥሐኪ ጥቀ ዘመልአክ ዜና።", "page": 94, "label": "ለቀራንብትኪ"}, {"n": 7, "text": "ሰላም ለአዕይንትኪ ዘተመሰላ አብያዘ፡ እለ ይፌጽማ ትእዛዘ፡ ማርያም ድንግል እንተ ኢተአምሪ ጋዕዘ፡ ናዝዝኒ በንባብኪ እመ ልብየ ተከዘ፡ በሐብለ ሰቆቃዉ ጽኑዕ ኢይኩን እኁዘ።", "page": 95, "label": "ለአዕይንትኪ"}, {"n": 8, "text": "ሰላም ለአዕዛንኪ እለ ሰምዓ ቃሎ፡ እግዚአብሔር እግዚእ ሶበ ለገብርኤል ተመስሎ። ማርያም ድንግል ጽሕቅት ለተሣህሎ፡ ሶበ ለልብየ እሳተ ኀዘን አሕለሎ፡ ያፅምአኒ እላ ነገርየ ኩሎ።", "page": 95, "label": "ለአዕዛንኪ"}, {"n": 9, "text": "ሰላም ለመላትሕኪ በእሳተ አንብዕ እለ ዉዕያ፡ ጊዜ ሰቀሉ በኩረኪ ዉሉደ ራኄል ወልያ፡ ማርያም ድንግል ለነብስየ ደብረ ምስካያ፡ አድኅነኒ እምአፍ ደም ዘአናብስተ ሐቅል አርአያ፡ ከመ ማኅፈር ጠቢብ ወምእመን ኬንያ።", "page": 95, "label": "ለመላትሕኪ"}, {"n": 10, "text": "ሰላም ለአዕናፍኪ መሳክወ ሠናይ መዓዛ፡ ይኄይስ ፈድፋደ እምፄና ስኂን ዘጠረጴዛ፡ ማርያም ድንግል ለሕይወትየ ምርጉዛ፡ ሰዋስዉ ዘምድረ ሎዛ እንተ ርእየኪ ወሬዛ፡ አመ ዕለተ ፍዳ ኩንኒ ቃዉመ ወቤዛ።", "page": 96, "label": "ለአዕናፍኪ"}, {"n": 11, "text": "ሰላም ለከናፍርኪ ከመ ፍሕሶ ቀይሕ፡ ቅዳሴ ወንጽሕ፡ ማርያም ድንግል ኆኃተ ጽባሕ፡ ባልሕኒ እምነ ወይሌ ወአንግፍኒ እምላህ፡ እስመ ለልብየ ኀዘኑ ብዙኅ፡፡", "page": 96, "label": "ለከናፍርኪ"}, {"n": 12, "text": "ሰላም ለአፉኪ ዘሰዐመ ርስነ፡ እንዘ አበ አዕሩግ ዉእቱ በጊዜ ኮነ ሕፃነ፡ ማርያም ድንግል ዘትፄንዊ ስኅነ፡ ኅፍረተ አበሳ ሶበ ገጽየ ተከድነ፡ ለናዝዞትየ እሙ ብጽሒ ፍጡነ።", "page": 96, "label": "ለአፉኪ"}, {"n": 13, "text": "ሰላም ለአስናንኪ ሐሊበ ዕጐልት ዘተዛወጋ፡ ወመራዕየ ቅሩፃተ እለ እምሕፃብ ዐርጋ፡ ማርያም ድንግል ለደብተራ ስምዕ ታቦተ ሕጋ፡ አፍቅርኒ እንበለ ንትጋ ለብእሴ ደም ወሥጋ፡ ዘየዐቢ እምዝ ኢየኀሥሥ ጸጋ።", "page": 97, "label": "ለአስናንኪ"}, {"n": 14, "text": "ሰላም ለልሳንኪ ሙኃዘ ሐሊበ ወመዓር፡ ዘተነብዮ ወፍቅር፡ ማርያም ድንግል ወለተ ድኁኃን፡ አድባር፡ ኅብእኒ እምዐይነ ፀር ወአንጽሕኒ እምነዉር፡ እስመ ተስፋየ አንቲ በሰማየ ወምድር። ሰላም ለቃልኪ እምአስካለ ወይን ጥዑም፡ ወእምድምፀ ናብሊስ አዳም ዘያረስዖ ለሕማም፡ ማርያም ድንግል ዘብርሃነ ሕይወት ተቅዋም፡ እመ ተሀዉከ በላዕለየ ማዕበለ ዝንቱ ዓለም፡ ከመ ያርምም ገሥፂዮ መሓሪት እም።", "page": 97, "label": "ለልሳንኪ"}, {"n": 15, "text": "ሰላም ለእስትንፋስኪ ዘመዓዛሁ ሕይወት፡ ከመ መዐዛ ዕፅ ኅሩይ ዘዉስተ ገነት፡ ማርያም ድንግል ቤተ ቅድሳት፡ጽንሕኒ ዉስተ ሠናይ ወሠዉርኒ እሞት፡ በአክናፍኪ ርግብየ ኅሪት።", "page": 98, "label": "ለእስትንፋስኪ"}, {"n": 16, "text": "ሰላም ለጉርዔኪ ሠናይ እምወይን፡ በከመ ይቤ ሰሎሞን፡ ማርያም ድንግል ለባሲተ ዐቢይ ብርሃን፡ ክድንኒ ገርዜነ ጸጋ ኢያዕፅበኒ ዕርቃን፡ ዘኢአነምዎ ጠቢባን በኪን።", "page": 98, "label": "ለጉርዔኪ"}, {"n": 17, "text": "ሰላም ለክሳድኪ ቃማ ንጽሕ ዘዐነቀ፡ ከመ አዋልድ አኮ ብሩረ ወወርቀ፡ ማርያም ድንግል ዘተመሰልኪ ማዕነቀ፡ ሕይወትየ በንዝህላል እመ ተሠልጠ ወኅልቀ፡ ወስክኒ ክራማተ እስከ እገብር ጽድቀ።", "page": 98, "label": "ለክሳድኪ"}, {"n": 18, "text": "ሰላም ለመታክፍትኪ እለ ግኁሣት እማንቱ፡ ለጌጋይ እምነ አርዑቱ፡ ማርያም ድንግል ለሆሤዕ ሠርጐ ትርሲቱ፡ በልኒ እግዝእትየ ጸሕቀ ሕሊናየ ዝንቱ፡ ፍኖተ የማን ይምራሕከ ወተአኰት ቦቱ።", "page": 99, "label": "ለመታክፍትኪ"}, {"n": 19, "text": "ሰላም ለዘባንኪ እምዘባነ ኪሩብ ዘዐብየ፡ ሐዚሎ እሳተ ወእምርስነ ነዱ ኢዉዕየ፡ ማርያም ድንግል ፈጻሚተ ኩሉ ጻሕቅየ፡ ሀብኒ እግዝእትየ ዘተመነይኩ ሠናየ፡ እንበለ አፅርዖ ፍጡነ በጺሐኪ ዝየ።", "page": 99, "label": "ለዘባንኪ"}, {"n": 20, "text": "ሰላም ለእንግድዓኪ ለእሳተ መለኮት ምርፋቁ፡ ማርያም ድንግል ለነዳይ ንዋየ ወርቁ፡ እመ ነገደ ርኅቀ ወሖረ ዕራቁ፡ ኢያኅዝኖ ሲሳይ እስመ አንቲ ስንቁ።", "page": 99, "label": "ለእንግድዓኪ"}, {"n": 21, "text": "ሰላም ለሕፅንኪ ለጥበበ ሰማይ ምዕራፋ፡ ዘኢትረከብ ሱታፋ፡ ማርያም ድንግል ጸጋዊተ ሰላም ወተስፋ፡ ኩንኒ እግዚእተየ ቅድመ ፀርየ ሐገፋ፡ ከመ ዖፍ አፍኅርቲሃ ትሤዉር በክንፋ።", "page": 100, "label": "ለሕፅንኪ"}, {"n": 22, "text": "ሰላም ለአእዳዉኪ እሳተ መለኮት እለ ገሠሣ፡ አውቃፈ ብሩረ ወወርቅ ለሥርጋዌሆን ኢኅሠሣ፡ ማርያም ድንግል ለመካን ህንባበ ከርሣ፡ አንጽሕኒ እግዝእትየ ለፍትወተ ዓለም እምርኩሳ፡ በዲበ ሥጋየ ኢትንበር ነጊሣ።", "page": 100, "label": "ለአእዳዉኪ"}, {"n": 23, "text": "ሰላም ለመዛርዕኪ ዘተረሰያ ኃይለ፡ ከመ ይፁራ ነበልባለ፡ ማርያም ድንግል እንተ ኅጣእኪ መምሰለ፡ ኃጢአትየ ለገብርኪ ከመ ፈድፈደ ተለዐለ፡ ከመ ጥቅም ዘባቢል ረስዩ ንኁለ።", "page": 100, "label": "ለመዛርዕኪ"}, {"n": 24, "text": "ሰላም እብል ለኲርናዕኪ እዌድሶ፡ ለእሳተ መለኮት በላዒ አምጣነ ኮነ ትርአሶ፡ ማርያም ድንግል ምዕዝት ዘእምአንክሶ፡ ህልዊ ደርገ ምስሌየ እንዘ አልብኪ ተግኅሦ፡ ለሕሊና ልብየ ወትረ እንግርኪ ማኅሠሣ።", "page": 101, "label": "ለኲርናዕኪ"}, {"n": 25, "text": "ሰላም ለእመታትኪ እለ ጸንዓ ይፍትላ፡ ሜላተ ወወርቀ በናዝሬት ወበገሊላ፡ ማርያም ድንግል ለዮዲት ጥበበ ቃላ፡ ብጽሒ በሠረገላ ንትመሐል መሐላ፡ ከመ ታኅድርኒ በብሔር ዘተድላ።", "page": 101, "label": "ለእመታትኪ"}, {"n": 26, "text": "ሰላም ለእራኃትኪ እለ ስፉሐት ለመጥዎ፡ ማርያም ድንግል እስእለኪ በተስፋዎ፡ ከመ እክሀል በበ ፆታሁ ስብሐታተኪ ዜንዎ፡ ለገብርኪ ዓብድ ምልእኒ ለብዎ።", "page": 101, "label": "ለእራኃትኪ"}, {"n": 27, "text": "ሰላም ለአፃብዕኪ እምእራኃ እዴኪ እለ ሠረፃ፡ እምኁልቈ ሠላድ ወስብዕ እንዘ ኢየሐፃ፡ ማርያም ድንግል ደብረ ኤልያስ ነቢየ ፋጻ፡ ዕቀብኒ በረድኤትኪ እምነ እርዌ ዘኆፃ፡ ህየንተ ሠናይ ለሰብእ ዘይሁብ ዐመፃ።", "page": 102, "label": "ለአፃብዕኪ"}, {"n": 28, "text": "ሰላም ለአጽፋረ እዴኪ መልዕልተ አፃብዕ እለ ሠረቃ፡ በበሕቅ ዘልፈ እንዘ ይልኅቃ፡ ማርያም ድንግል ማኅቶትየ በውስተ ጣቃ፡ ኢትሰድኒ ለገበርኪ ለዓመትየ በንፍቃ፡ ዝንቱ ውእቱ ለልብየ ጻሕቃ።", "page": 102, "label": "ለአጽፋረ"}, {"n": 29, "text": "ሰላም ለአጥባትኪ እለ አውኃዛ ፍጽመ፡ ድንግልናዌ ሐሊበ ዉስተ አፈ አምላክ ቅድመ፡ ማርያም ድንግል እንተ አምጻእኪ ሰላመ፡ ኅክታመ፡ ዘእንበሌኪ ኢየኅሥሥ እመ።", "page": 102, "label": "ለአጥባትኪ"}, {"n": 30, "text": "ሰላም ለገቦኪ ዘሐመልማለ ወርቅ ክዳኑ፡ በከመ ዳዊት ይዜኑ፡ ማርያም ድንግል ለያቆብ ሞገሰ ሥኑ፡ በልኒ እግዝእትየ አፈቅረከ አኮኑ፡ እንዘ ረዳኢትከ አነ ዘይክለከ መኑ።", "page": 103, "label": "ለገቦኪ"}, {"n": 31, "text": "ሰላም ለከርሥኪ ዘአፈድፈደ ተበፅዖ፡ እምታቦተ ሙሴ ነቢይ ለጽሌ ትእዛዝ ዘየኀብኦ፡ ኣምርያም ድንግል ጊዜ ጽዋዕኩኪ በአስተብቍዖ፡ ለፀርየ ብእሴ ዐመፃ ኃይለ ዚአኪ ይጽብዖ፡ እስከነ ያስቆቁ ጥቀ ድኅሪተ ገቢኦ።", "page": 103, "label": "ለከርሥኪ"}, {"n": 32, "text": "ሰላም ለልብኪ እምነ በቀል ርኅቅ፡ እምጥነ ዐረብ ወሠርቅ፡ ማርያም ድንግል ገነት ኅሩያን ደቂቅ፡ ክድንኒ ልብሰ ከብካብ ለቅኑይኪ ዕሩቅ፡ ከመ ጽጌሁ ዘወርቅ።", "page": 103, "label": "ለልብኪ"}, {"n": 33, "text": "ሰላም እብል ለኩልያትኪ ክልኤ፡ ዘቅብዐ ክህነት ቀርን ወዘወይነ ትፍሥሕት ግምዔ፡ ማርያም ድንግል ብልኒ ቅድመ ጉባኤ፡ ሕፃንየ በእንቲአየ ይከዉነከ ረዳኤ፡ እመራደ ፀርከ ሕቀ ኢትፍራህ ትንሣኤ።።", "page": 104, "label": "ለኩልያትኪ"}, {"n": 34, "text": "ሰላም ለሕሊናኪ ሐልዮ ሠናያት ልማዱ፡ ወገበረ ምሕረት መፍቅዱ፡ ማርያምን ድንግል ለዳዊት ወለተ ወልዱ፡ ንዝሕኒ በአዛብኪ ዘይትረከብ ዘመዱ፡ ወበማየ ሕይወት ሕፀብኒ እምበረደ እፃዕዱ።", "page": 104, "label": "ለሕሊናኪ"}, {"n": 35, "text": "ሰላም ለአማሁትኪ ነበልባለ ኅዘን ዘአውዐየ፡ እመ ወዐለ ወልዲኪ ስቄለ በቀራንዮ፡ ማርያም ድንግል ፀምረ ጠለ ዘተነበዩ፡ ጌጋይየ አስተርአዮ እንተ አልብኪ ተፈልዮ፡ በሥርዐተ ካህን ላዕሌየ አንኂ ጸልዮ።", "page": 104, "label": "ለአማሁትኪ"}, {"n": 36, "text": "ሰላም ለንዋየ ዉሥጥኪ አምሳለ ንዋያ ለደብተራ፡ ስብሐተ ልዑል ዘይሤዉራ፡ ማርያም ድንግል ትምክሕተ ደቂቃ ለሣራ፡ ባልሕኒ ወለተ ቅስራ ለዓለመ ጽልመት እምፃዕራ፡ እስመ መቅዓን ወጠዋይ ምሕዋራ።", "page": 104, "label": "ለንዋየ"}, {"n": 37, "text": "ሰላም ለንዋየ ውሥጥኪ አምሳለ ብዋያ ለመቅደስ፡ ንዋይኪሰ ኢየሱስ ክርስቶስ፡ ማርያም ድንግል ዘገዳመ ሲና ጳጦስ፡ ከመ ያነቅሖ ለልበ ዘፋኒ ናብሊስ፡ ፍቅርኪ ያንቅሐኒ በሥጋ ወነፍስ።", "page": 105, "label": "ሰላም ለንዋየ"}, {"n": 38, "text": "ሰላም ለኅንብርቲኪ ከመ ማዕከክ ርእየቱ፡ ዘኢየዓርቅ እምቱስሕቱ፡ ማርያም ድንግል ለካህን ዕፀ ኅርየቱ፡ ከመ ኢይኩን ፅሩዐ ንባበ አፍየ ዝንቱ፡ በጽዋዐ ኪሩብ ደዩዮ ወሡጢዮ ሎቱ።", "page": 105, "label": "ለኅንብርቲኪ"}, {"n": 39, "text": "ሰላም ለማኅፀንኪ ለእግዚአብሔር ማኅፈዱ፡ ዘሐነፀኪ የማነ እዱ፡ ማርያም ድንግል ማዕዝት ዘእምናርዱ፡ ኅቤኪ ያንቀዐዱ ለረኪበ ኩሉ ምፍቅዱ፡ ምስለ ካልኡ ዐይንየ አሐዱ።", "page": 106, "label": "ለማኅፀንኪ"}, {"n": 40, "text": "ሰላም ለማኅፀንኪ ለእግዚአብሔር ዘውጉ፡ ብዑድ ሥርዐቱ ወፍሉጥ ሕጉ፡ ማርያም ድንግል ለአስካለ ሕይወት ሐረጉ፡ በልኒ እግዝእትየ ኃጢአተከ ኀደጉ፡ ወመኃልየከ ስማየ አዕረጉ።", "page": 106, "label": "ለማኅፀንኪ"}, {"n": 41, "text": "ሰላም እብል ለድንግልናኪ ዕፅው፡ እንተ እምኔሁ ሠረቀ ፀሐየ መለኮት ኅትው፡ ማርያም ድንግል ዘሥነ ንጽሕኪ ፍትው፡ ለኅዲር በበፍናዉ በአህጉር ወበድው፡ ዕቀኒ ወለቶሙ ለኄራን አበዉ።", "page": 106, "label": "ለድንግልናኪ"}, {"n": 42, "text": "ሰላም ለሐቌኪ በትረ ሌዋዊ ሣዉዕ፡ ዘኢሐፀነኪ ጠል ወዘኢ ሠቀየኪ ነቅዕ ፡ ማርያም ድንግል እግእእተ መላእክት ወሰብእ፡ ሰድኒ ብሔረ ፍግዕ በትንባሌኪ ባቍዕ፡ ምስለ ኅሩያንኪ ደርገ አበሉ በስንዕ።", "page": 107, "label": "ለሐቌኪ"}, {"n": 43, "text": "ሰላም ለአቍያጽኪ እለ ይነብራ ድርገተ፡ እምነ አብራክኪ ላዕለ ወእምነ ሐቌኪ ታሕተ፡ ማርያም ድንግል እንተ ኢተአምሪ ርስሐተ፡ ጽባሐ ወምሴተ ኩሎ ዕለተ፡ ዘይስማዕ ምሕረተኪ ግብሪ ሊተ።", "page": 107, "label": "ለአቍያጽኪ"}, {"n": 44, "text": "ሰላም ለአብራክኪ በስብሐተ ልዑል ዘአስተብረካ፡ እምአመ ወሀቡኪ ብፅዐ ውስተ አሪታዊት ታዕካ፡ ማርያም ድንግል መንበር ዘአብነ ፔካ፡ ጊዜ ስደቶሙ ለኃጥአን እምዐፀደ ዐባይ ፋሲካ፡ ፄውዉኒ መንገሌኪ እኩንኪ ምህርካ።", "page": 107, "label": "ለአብራክኪ"}, {"n": 45, "text": "ለአእጋርኪ እለ ፃመዋ በረዊፅ፡ እምቤተ ልሔም ዘይሁዳ እስከ ምድረ ግብጽ፡ ማርያም ድንግል ሥርዓተ ነበልባል ዕፅ፡ ለኅዲር በቤተ ናሕስ እንተ መልዕልተ ኰኩሕ ህኑጽ፡ አጥብብኒ በተግሣፅ ወሡቅኒ እምዳኅፅ።", "page": 108, "label": "ለአእጋርኪ"}, {"n": 46, "text": "ሰላም እብል ለዘዚአኪ ሰኰና፡ ዘኢድኅፀ በውስተ ፍና፡ ማርያም ድንግል ትእምርተ ኪዳን ቀስተ ደምና፡ አምዕዝኒ በዕፍረትኪ ወጸግውኒ ጥዒና፡ በከመ ትገብር እምለንዑስ ሕፃና።", "page": 108, "label": "ለዘዚአኪ"}, {"n": 47, "text": "ሰላም ለምከየድኪ እለ ረከቦን መከራ፡ እምፍርሃተ ቀተልት ሐራ፡ እንበለ አሣእን አመ ሖራ፡ ማርይም ድንግል ታቦተ ቃለ ጽድቅ መንፈቀ ዕሥራ፡ ዕጐላት እምዕጐሊሆን ከመ ኪያኪ አፍቀርኩኪ አፍቅርኒ እምይእዜ ለግሙራ።", "page": 108, "label": "ለምከየድኪ"}, {"n": 48, "text": "ሰላም እብል ዘአእጋርኪ አፃብዐ፡ ሐሳበ ኁልቆን ዘኮነ ምስለ ስድስ ርብዐ፡ ማርያም ድንግል ዘተሰመይኪ ምሥዋዐ፡ በረዊፅ ወብጉጉአ አፍጥኒ መጺአ፡ ሶብ አፋየ ስመኪ ስውዐ።", "page": 109, "label": "ዘአእጋርኪ አፃብዐ"}, {"n": 49, "text": "ሰላም ለአፅፋረ እግርኪ ዘኢፈቀዳ ለሥርጋዌ፡ ጥምዐታተ ሕምር ምድራዌ፡ ማርያም ድንግል ሐውልተ ስምዕ ዘወልደ ነዌ፡ ሡቅኑ እምትንታኔ ወባልሕኒ እምአርዌ፡ ላዕለ እምየ ዘአምጽአ ደዌ።", "page": 109, "label": "ለአፅፋረ"}, {"n": 50, "text": "ሰላም ለቆምኪ በቀልተ ዘተመስለ፡ ኅበ ሙኅዘ ማይ ዘበቈለ፡ ማርያም ድንግል እስእለኪ ስኢለ፡ ኢይረድ ታሕቲተ ምጥቅኒ ላዕለ፡ ኢረከብኩ በርኅራኄ ከማኪ ዘብዕለ።", "page": 109, "label": "ለቆምኪ"}, {"n": 51, "text": "ሰላም ለመልክዕኪ ዘተሠርገወ አሜረ፡ ዘያበርህ ወትረ፡ ፍቅርትየ አንቲ እንተ ታበድሪ ፍቅረ፡ አርእይኒ ገጸ ዚአኪ ማርያም ምዕረ፡ ዘኢይሰምዖ ካልእ እንግርኪ ነገረ።", "page": 110, "label": "ለመልክዕኪ"}, {"n": 52, "text": "ሰላም ለፀአተ ንፍስኪ እንበለ ፃዕር ወፃማ፡ ለነቢር ዘልፈ በየማነ ወልድኪ ፌማ፡ ማርያም ድንግል ክልልተ ሞገሰ ወግርማ፡ አጽንዒ በረድኤትኪ ለሕይወትየ ድካማ፡ እምሕይወተ ኄራን አበው ኢታሕ ጽጺ ዐቅማ።", "page": 110, "label": "ለፀአተ"}, {"n": 53, "text": "ሰላም እብል በድነ ሥጋኪ ጽሩየ፡ ዘተመሰለ ባሕርየ፡ ኣርያም ድንግል ዐፀደ ወይንየ፡ ንስቲተ ለዕበይኪ እንተ አቅረብኩ ግናየ፡ ኢይትኅደግ ዲበ ምድር ምሥጢ ሰማየ።", "page": 110, "label": "እብል በድነ ሥጋኪ"}, {"n": 54, "text": "ሰላም ለግንዘተ ሥጋኪ በእደ ሐዋርያት አርጋብ፡ በአፈወ ዕፍረት ቅድው ዘሐሳበ ሤጡ ዕፁብ፡ ማርያም ድንግል ወለተ ኅሩያን ሕዝብ፡ ረሰይኩኪ እግዝእትየ ህየንተ እም ወአብ፡ ይኅፅነኒ ከመ ጥብ ፍቅርኪ ሐሊበ።", "page": 111, "label": "ለግንዘተ"}, {"n": 55, "text": "ሰላም ለመቃብርኪ ለጌቴሴማኒ በመርኅባ፡ እንተ ይእቲ ለኢየሩሳሌም ቅሩባ፡ ማርያም ድንግል ለሀገረ መንግሥት ርግባ፡ ትትሜጦ ወርቅ እምአፌር ወጸበለ አፈው እምበሳ፡ ጌቴሴማኒ ለሥጋኪ ምስካባ።", "page": 111, "label": "ለመቃብርኪ"}, {"n": 56, "text": "ሰላም ለመቃብርኪ ለኢየሩሳሌም በአድያማ፡ እንተ ይእቲ ጌቴሴማኒ ስማ፡ ማሪያም ሰንበተ ዕረፍተ ጽዑራን እምፃማ፡ አመኅደረ ላዕለኪ ፀሐየ ቅዱሳን ዘራማ፡ ኃይለ ልይለ ጸለለኪ በመንክር ግርማ።", "page": 111, "label": "ለመቃብርኪ ሊኢየሩሳሌም"}, {"n": 56, "text": "ሰላም ለፍልሰተ ሥጋኪ መካነ ፍሥሓ ምጡቀ፡ በአእባነ ባሕርይ በተነድቀ፡ ማርያም ድብተራ እንተ ኢትትከደኒ ሠቀ፡ ጽሒፈ ውዳሴኪ እምኪ ኅልቀ ሶበ ኮነ ጥቀ፡ ዝናመ ክረምት ቀለመ ወሰማይ ረቀ።", "page": 112, "label": "ለፍልሰተ"}, {"n": 57, "text": "ሰላም ለፍልሰተ ሥጋኪ ወለተ ንጉሥ ይሁዳ፡ ወለተ ሌዊ እኁሁ ዘሀብተ ክህነቱ አግዳ፡ ማርያም ድንግል ምዕዝት ዘእምስጌ ረዳ፡ በጽሒፍ ኢይፌጽሞ ለስብሐትኪ እንግዳ፡ እመ ኮነ በቅድሜየ ስፍሐ ምድር ሠሌዳ።", "page": 112, "label": "ለፍልሰተ ሥጋኪ"}, {"n": 58, "text": "ሰላም ለፍልሰተ ሥጋኪ ደባትረ ብርሃን ኅበ ተተክሉ፡ ለገነተ ጽባሕ በማእክሉ፡ ውድስት አንቲ ወስብሕት በአፈ ኩሉ፡ እምነ ጻድቃን ዘታሕቱ ወእምትጉሃን ዘላዕሉ፡ ማርያም ለኪ ስብሐተ አደሉ።", "page": 112, "label": "ለፍልሰተ"}, {"n": 59, "text": "በዝንቱ ቃለ ማኅሌት ወበዝንቱ ይባቤ፡ ለዘይስእለኪ ብእሲ ጊዜ ረከቦ ምንዳቤ፡ ማርያም ዕንቁየ ክርስቲሎቤ፡ ወምዕዝተ ምግባር እምከርቤ፡ ዘጸገየ ማኅፀንኪ አፈወ ነባቢ።", "page": 113, "label": "በዝንቱ"}, {"n": 60, "text": "ስብሓት ለኪ ማርያም በኁልቈ ኩሉ ሥዕርትየ፡ ስብሐት ለኪ ማርያም በኁልቈ ኩሉ ዘተርአየ፡ ስብሐት ለኪ ንግሥትየ በኁልቈ ኩሉ ዘኢያስተርአየ፡", "page": 113, "label": "ስብሓት"}, {"n": 61, "text": "ስብሐተ ድንግልናኪ ዘልፈ ይነግር አፍየ። እግዚአብሔር ኅቤኪ ፈነወ ቃሎ፡ ገብርኤልሃ አስተማሲሎ፡ ማርይምአምላክ ዘወለድኪ በተደንግሎ፡ ሰላም ሰላም ወሰላም እብሎ፡ ለመልክዕኪ ፈጺምየ ኩሎ።", "page": 113, "label": "ስብሐተ"}, {"n": 62, "text": "ለዘኢያፈቅረኪ እግዚትየ ማርያም ውኩፈ ኢይኩን ጽሎቱ፡ ይትገዘም ኑኅ ዓመቱ ወይጥፋእ በከንቱ፡ በአፈ መላእክት ወስብእ ይትረገም ለለሰዓቱ፡ ዘአስተማሰሎ በተውኔት ለማኅሌተ ንግሥኪ ዝንቱ፡ ጌጋዩ ወኃጢአቱ ኢይትኃደግ ሎቱ። ኦ እግዝእትየ ማርያም ዕቀብኒ ወአድኅንኒ እመከራ ሥጋ ወነፍስ ሊተ ለገበርኪ፡ ሊተ ለአመትኪ።", "page": 114, "label": "ለዘኢያፈቅረኪ"}]}]}, {"id": "melka_iyesus", "title": "መልክአ ኢየሱስ", "en": "Melke'a Iyesus", "sections": [{"id": "melka_iyesus_1", "title": "መልክአ ኢየሱስ", "en": null, "page": 115, "items": [{"n": 1, "text": "ኢየሱስ ኢየሱስ ኢየሱስ ክርስቶስ ዘሠረፅከ ኢምቤተ ሌዌ፡ ኮሬባዊ መለኮታዊ፡ ቃል ሰማያዊ እም ድንግል ተወልደ።", "page": 115, "label": "ኢየሱስ"}, {"n": 2, "text": "ሰላም ለዝክረ ስምከ ስመ መሓላ ሰኢይሔሱ፡ ዘአንበረ ቅድመ እግዚአብሔር በአትሮንሱ፡ ኢየሱስ ክርስቶስ ለዳዊት ባሕርየ ከርሡ፡ አክሊለ ስምከ እንዘ ይትቄጸል በርእሱ፡ አህጉረ ፀር ወረሰ ኢያሱ።", "page": 115, "label": "ሰላም ለዝክረ ስምከ"}, {"n": 3, "text": "ሰላም ለሥዕርተ ርእስከ ዘሥሙር አብቋሉ፡ ወጽፋቅ ጥቀ ለአርዘ ሊባኖስ አምሳለ ቄጽሉ፡ ኢየሱስ ክርስቶስ ሊቀ ካህናት ዘላዕለ ኩሉ፡ ይጸሐፍ በልሳንየ ለውዳሴከ ፈደሉ፡ ኢይትኃደግ ዲበ ምድር ንባቡ ወቃሉ።", "page": 115, "label": "ለሥዕርተ ርእስከ"}, {"n": 4, "text": "ሰላም ለርእሰከ በመንበረ ክሳድ ዘተሣረረ፡ እንዘ ማእሰ ሥጋ ይለብስ ወእንዘ ይትገለበብ ጸጉረ፡ ኢየሱስ ክርስቶስ ከመ ቃልከ ነገረ፡ ይወርሱ በእንቲአከ ንዳያነ ዓለም ክብረ፡ ወቀደምትኒ ይከዉኑ ድኅረ።", "page": 116, "label": "ለርእሰከ"}, {"n": 5, "text": "ሰላም ለገጽከ እም ሥነ ኦርይሬስ ስቡሕ፡ ወፍሡሕ ከመ ወርኅ ዘአሜገሃህ፡ ኢየሱስ ክርስቶስ ታቦተ ሕይወቱ ለኖኅ፡ ኅብአኒ እግዚኦ በውሣጤከ ስፋሕ፡ ማየ ኩነኔ አመ ዘንመ አይኅ።", "page": 116, "label": "ለገጽከ"}, {"n": 6, "text": "ሰላም ለቀራንብቲከ ከመ ክልኤ ክንፈ ኪሩብ፡ እለ ይጸልላ ወትረ አዕይንቲከ ዘርግብ፡ ኢየሱስ ክርስቶስ እደ መዝራእቱ ለአብ፡ አስተጋበ ውስተ ልብየ አቅማሐተ ኩሉ ጥበብ፡ ከመ ጽጌያተ ዘገዳም ያስተጋብእ ንህብ።", "page": 116, "label": "ለቀራንብቲከ"}, {"n": 7, "text": "ሰላም ለአዕይንቲከ ከመ ምሉዕ ምዕቃለ ማይ፡ እለ ይትረአያ ወትረ በመንበረ መጽሔት ርሡይ፡ ኢየሱስ ክርስቶስ መስተሥርየ ኩሉ ጌጋይ፡ ንዝኅኒ እግዚኦ በአዛብከ ሠናይ፡ ወአፃዕድወኒ እምበረድ ጽሩይ።", "page": 117, "label": "ለአዕይንቲከ"}, {"n": 8, "text": "ሰላም ለአዕዛኒከ ጽልዋተ እለ ኮና፡ አምኅ ነገር ያብኣ ለመኮንነ ውሥጥ ሕሊና፡ ኢየሱስ ክስቶስ ዘያዕቆብ ዓምደ ደመና፡ ምርሐኒ እግዚኦ ኅበ ይትፈቀድ ፍና፡ በዓመተ ርስዐን ወድካም ኢይርአይ ሙስና።", "page": 117, "label": "ለአዕዛኒከ"}, {"n": 9, "text": "ሰላም ለመላትሒከ እለ ይፈርያ አፈዋተ፡ ከመ ርኄ አፈው ዘይፄኑ ርኁቀ ፍኖተ፡ ኢየሱስ ክርስቶስ እስመ አበ ንፍስየ አንተ በሎሙ ለመላእክት ተፈሥሑ ሊተ፡ ረከብክዎ ለወልድየ በከንቱ ዘሞተ።", "page": 117, "label": "ለመላትሒከ"}, {"n": 10, "text": "ሰላም ለአዕናፈከ መሳክወ ፄና ወአናቅጽ፡ እለ ውዱዳት እማንቱ ማእከለ ክልኤ አብይጽ፡ መልአከ ሕይወትየ ክርስስቶስ አስተሪየኒ በገጽ፡ ናሁ ተመሠጥኩ በጣዕመ መስቀልከ ዕፅ፡ ወተነደፍኩ በፍቅርከ ሐጽ።", "page": 118, "label": "ለአዕናፈከ"}, {"n": 11, "text": "ሰላም ለከናፍሪከ ሙኃዛተ ከርቤ ሐዋዝ፡ እምጽጌ ገዳማት ኩሎን ዘፄናሆን ምዑዝ፡ ኢየሱስ ክርስቶስ በግዐ ይስሐቅ እኁዝ፡ ይተከዐው ዉስተ አፋየ ከመ አዜባዊ ውኂዝ፡ ነቅዐ ገቦከ በኩናት ርጉዝ።", "page": 118, "label": "ለከናፍሪከ"}, {"n": 12, "text": "ሰላም ለአፍከ ለዮሐንስ ዘስዐሞ፡ ንጽሐ ሕሊናሁ ወልቡ ለዓይነ ፍትወትከ ሶበ አደሞ፡ ኢየሱስ ክርስቶስ መፍቀሬ የዋሃት እምሃት እምተ ቀይሞ፡ ጸግወኒ ማዕፆ አፍ እንተ ይእቲ አርምሞ፡ ለትዕግሥትካ ከመ አእምር ዐቅሞ።", "page": 118, "label": "ለአፍከ"}, {"n": 13, "text": "ሰላም ለአስናኒከ አይተ አዕናቍ እለ ተሰክዓ፡ በፈትለ ሥጋ ወደም እስከ ሥረዊሆን ጸንቦ፡ ኢየሱስ ክርስቶስ ዘተሰመይከ ምሥዋዐ ከርስየ ርኅበ እግዚኦ ወውሣጤ ጉርዔየ ጸምአ ፡ እንበለ ኩነኔ ሀበኒ ሥጋከ መብልዐ።", "page": 119, "label": "ለአስናኒከ"}, {"n": 14, "text": "ሰላም ለልሳንከ በደብረ ታቦር ዘአልኆሰስ፡ ለብርሃን ዐቢይ እስከ ጽላሎቱ ተሐውሰ፡ ነበልባለ እሳት ክርስስቶስ ዘተዋሐድከ ጳጦስ፡ በዋዕየ ፍቅርከ ከመ ሥጋወ አእዋም የብሰ፡ ውሣጤ ሕሊናየ ነደ ወልብየ ጤስ።", "page": 119, "label": "ለልሳንከ"}, {"n": 15, "text": "ሰላም ለቃልከ እማእሠሪሁ ዘፈትሖ፡ ለፍቅር አልአዛር ኃይለ ሥልጣን ሞት ድኅረ ሞቅሖ፡ ኢየሱስ ክርስቶስ ንጉሥ ሰላም ወተራኅርኆ፡ አባ ወአቡየ እሴብሐከ ሰብሖ፡ ለአንቀጽከ ጸግወኒ መርኆ።", "page": 119, "label": "ለቃልከ"}, {"n": 16, "text": "ሰላም ለእስትንፋስከ እስትንፋስ ላህብ ምውቅ፡ ጊዜ ፍና ሠርክ ዘነፍሐ ገነተ ኅሩያን ደቂቅ፡ ኢየሱስ ክርስቶስ ጠፈረ ሃይማኖት ወጽድቅ ይትወኅውኁ ከዋክብት በአየርከ ምጡቅ፤ ወያንበሰብሱ ደመናት በዐረብ ወሠርቅ።", "page": 120, "label": "ለእስትንፋስከ"}, {"n": 17, "text": "ሰላም ለጉርዔከ በጽምአ ፍቅረ ሰብእ ሐማሚ፡ እስከ ስቴ ሐሞት ጥዕመ ወዘወይነ ትፍሥሕት ከራሚ፡ ኢየሱስ ክርስቶስ መምህረ ጳዉሎስ ዘብንያሚ፡ አመ ነሥአ ማኅተመ ጸጋ እንዘ ስመከ ይሰሚ፡ አልቦ አይሁድ ወአልቦ አረሚ።", "page": 120, "label": "ለጉርዔከ"}, {"n": 18, "text": "ሰላም ለክሣድከ ግብረ መንፈስ ቅዱስ ኬኒያ፡ አዳም ሥና ወመንክር ላህያ፡ ኢየሱስ ክርስቶስ ነቢይ ወሓዋርያ፡ አመ ወፅአ ስሙዓቲከ በአድያመ ኩሉ ሶርያ፡ ብፁዓት አዕይንት ኪያከ ሶርያ፡ ብፁዓት አዕይንት ኪያከ ዘርእያ።", "page": 121, "label": "ለክሣድከ"}, {"n": 19, "text": "ሰላም ለመትከፍትከ ከመ ልብሰ ክህነት ለጉዮ፡ ጊዜ ፀአተ ፍትሕ ዘፆረ አርዑተ መስቀል በቀራንዮ፡ ኢየሱስ ክርስቶስ በግዐ መድኅኒት ወአስተሥርዮ፡ አስተዳሎከ ለርእስከ ውስተ ዐፀደ ግፍዕ ተርእዮ፡ ወኩሎ በዘይደሉ አቅደምከ ሐልዮ።", "page": 121, "label": "ለመትከፍትከ"}, {"n": 20, "text": "ሰላም ለዘባንከ እመለኮቱ ዘኢተዐርቀ፡ እንዘ በአፍአሁ ይትዌከፍ ጥብጣቤ ሕማማት መጽዕቀ፡ ጉንደ ሐረገ ወይን ክርስቶስ እንተ ትፀውር አዕፁቀ፡በቤተ ከብካብ ጊዜ ትገብር ምርፋቀ፡ ለአስካልከ ረስየኒ ዝቀ።", "page": 121, "label": "ለዘባንከ"}, {"n": 21, "text": "ሰላም ለእንግድዓከ ቀላየ ልቡና ወአእምሮ፡ በሐመረ ፍትወት ወጻሕቅ ልበ ጠቢባን ዘኢሰፈሮ፡ ኢየሱስ ክርስስቶስ ኂሩት ወተፋቅሮ፡ ሶበ ይገሥሥ ሕልናየ ለመንዲልከ ዘፈሮ፡ ንቅዐ ኅጢአትየ ለገበርከ እምድሩ ይሠሮ።", "page": 122, "label": "ለእንግድዓከ"}, {"n": 22, "text": "ሰላም ለኅፅንከ ምርፋቀ በረከት ወሣህል፡ ዘአስመከ ቦቱ ወልደ ዘበዴዎስ ድንግል፡ ኢየሱስ ክርስቶስ ሃይማኖትየ ወንጌል፡ ከመዕፀ ሐምል ስፍሕተ አዕፅቅ ወቄጽል፡ ብዙኅተ አዕዋፈ አጽልሎተ ተክል።", "page": 122, "label": "ለኅፅንከ"}, {"n": 23, "text": "ሰላም ለአኢዳዊከ ጽቡረ እለ ገብራ፡ በምራቀ አፍከ ቅዱስ አዕይንተ ዕዉር ይፍጥራ፡ ትምህርተ ኅቡአት ክርስቶስ ዘትትነገር ኢምጵርስፎራ፡ ነገስታት በእንቲአከ ይገድፋ ጌራ፡ ወዕጠቆሙ ይፈትራ።", "page": 123, "label": "ለአኢዳዊከ"}, {"n": 24, "text": "ሰላም ለመዛርዒከ ከመ ቀስተ ብርት ጽኑዕ፡ እለ ያነትዓ ፀረ አመ ዕለተ መንፈስ ወጸብዕ። ኢየሱስ ክርስቶስ ጠረጴዛየ ምሥዋዕ፡ አስትየኒ ማየ ሕይወት ኢመስቀልከ ጽዋዕ፡ ዘእንበሌሁ ኢይድኅን ሰብእ።", "page": 123, "label": "ለመዛርዒከ"}, {"n": 25, "text": "ሰላም ለኩርናዕከ ኩርናዐ ክቡድ አንበሳ፡ ዘቀጥቀጠ ኩሎ አርእስተ ሥቡሐን እንስሳ፡ ኢየሱስ ክርስቶስ ሞገሰ ዳንኤል ነቢየ ሱሳ፡ ድኅረ ተፈጸመ ሱባዔ ሰንበታት ስሳ፡ በምጽአትከ ተኅትመ አበሳ።", "page": 123, "label": "ለኩርናዕከ"}, {"n": 26, "text": "ሰላም ለእመትከ መስፈርተ መዛርዕ ወእድ፡ እስከ ጽንፈ መስቀል በሐብል ዘስሐብዎ አይሁድ፡ ኢየሱስ ክርስቶስ እምነ አእላፍ ውሉድ፡ ኅድፈኒ ብጥበብከ እምተሠጥሞ ጌጋይ ክቡድ፡ ናሁ በላዕሌየ ተንሥኤ ሞገድ።", "page": 124, "label": "ለእመትከ"}, {"n": 27, "text": "ሰላም ለእራኅከ መክፈልተ ሕማማት ሱቱፍ፡ ወቅንዋቲሁ እኤምኅ በአፍ፡ ኢየሱስ ክርስቶስ በላዕለ ቅዱሳን ዕሩፍ፡ ይፀንስ ውስተ ከርሥየ ዘርአ ቃልከ መጽሐፍ፡ ፀዳለ እምፀዳል ከመ ትፀንስ ዖፍ።", "page": 124, "label": "ለእራኅከ"}, {"n": 28, "text": "ሰላም ለአፃብዒከ አፃብዐ አዳም ዘተኬነዋ፡ ወነቀላ ዐፅመ በእንተ ሕይወታ ለሔዋን፡ ኢየሱስ ክርስቶስ አመ ተለዐልከ እምድረ ፄዋ፡ ለገነተ ጽድቅ ዘእደ ሱራፈ ዐፀዋ፡ ቤዛ ኀጢአን ኩሎሙ ደምከ አርኅዋ።", "page": 124, "label": "ለአፃብዒከ"}, {"n": 29, "text": "ሰላም ለአፅፋረ እዴከ ዘኅበሪሆን ፀዐዳ፡ በምግባር ወግእዝ እለ ይትዋሐዳ፡ ኢየሱስ ክርስቶስ ምስፍና አባሉ ለይሁዳ፡ ለመንግሥትከ ስፋኒት እንዘ ይትመሐለሉ ዐዉደ፡ ሰብአ ሰገል አወፈዩ ጋዳ።", "page": 125, "label": "ለአፅፋረ"}, {"n": 30, "text": "ሰላም ለገቦከ ዐዘቅተ ሥጋዌ ፍሉሕ፡ እንተ እምኔሁ ተውህበ ፈልፈለ ቅዱሳት ወንጽሕ፤ ኢየሱስ ክርስቶስ ዘኢሳይያስ መካሕ፡ አመ አስትርአይከ በልብሰ ባሦር ቀይሕ፡ መልአከ ሞት ተሠጥመ በላህ።", "page": 125, "label": "ለገቦከ"}, {"n": 31, "text": "ሰላም ለከርሥከ ዘኢትፈተን መዝገቡ፡ ም ዕመቁ ወሚ ራኅቡ፡ ኢየሱስ ክርስቶስስ ለወንጌል ንግሥከ ባሕር አስትአ በረከት ወሀቡ፡ ወእለ የኀድሩ ዲበ የብስ አምኅ አቅረቡ። ሰላም ለልብከ ቅሩበ ኩልያት ምንታዌ፡ እንተ ያንሰሐስሕ ቦቱ መንፈስ ሕሊናከ ኅበ ህላዌ፡ ኢየሱስ ክርስቶስ ፍጹመ ትስብእት ወሥጋዌ፡ በቃለ እንቲአከ አመ ትትፍታህ ነነዌ፡ ውስተ መቅደስከ ረስየኒ ሠርዌ።", "page": 125, "label": "ለከርሥከ"}, {"n": 32, "text": "ሰላም ለሕሊናከ ዘይሔሊ ሠናያተ፡ ለውሉደ ሰብእ ምሕረተ፡ ክርስቶስ ብርሃን ዘአስሰልከ ጽልመተ፡ ላዕለ ኪሩቤል ነቢረከ ዘትሬኢ ቀላያተ፡ ስብሕኒ ወልዑል አንተ።", "page": 126, "label": "ለሕሊናከ"}, {"n": 33, "text": "ሰላም ለኅንብርትከ ማእከለ ጠባይዕ ዘተመልአከ፡ በኩሉ ቱስሕቱ እንዘ ይትሜስል ማእከከ፡ መንግሥተ ሰማያት ክራስቶስ ከመ ዮሓንሰ ሰበከ፡ በሐፍ ወበድካም እለ አሥመሩ ኪያከ፡ ዲናረ ሃይማኖት ነሢኦሙ የአትው ሠርከ።", "page": 127, "label": "ለኅንብርትከ"}, {"n": 34, "text": "ሰላም ለሐቌከ እንዘቦ ልዕልና፡ ከመ ገብር ድኩም ዘቀነተ ሐብለ ትሕጥና፡ ኅብስተ ሕይወቶሙ ክርስቶስ ለእለ ይነሥኡ ስመ ክርስትና፡ አኮአ ኅብስተ እስራኤል መና፡ ዘዕሤተ ሞት ፈደየ በሲና።", "page": 127, "label": "ለሐቌከ"}, {"n": 35, "text": "ሰላም ለአቍያጺከ አዕማድ ያቁም ወበለዝ፡ እለ ይፀወራ ቦቶን መልክዐተ ኩሉ ትእዛዝ፡ ኢየሱስ ክርስቶስ ምጽላለ ሕይወትየ አርዝ፡ ተበአሶ በጽላሎትከ ለአርዌ ዐመፃ ወሕምዝ፡ ኢይሳነነኒ ለገብርከ ዳግመ እምዝ።", "page": 127, "label": "ለአቍያጺከ"}, {"n": 36, "text": "ሰላም ለአብራኪከ እለ አውተራ ስግደተ፡ እንዘ የዓርጋ ላዕለ ወእንዘ ይወርዳ ታሕተ፤ ጊዜ ተቀባዕከ ክርስቶስ ዘአልቦስጥሮስ ዕፍረተ፡ ገብርከሰ እምፈተውኩ አሜሃ ዕለተ፡ ማርያምሃ ትኩነኒ እኅተ።", "page": 128, "label": "ለአብራኪከ"}, {"n": 37, "text": "ሰላም ለአእጋሪከ እለ ጠብዓ ለቀዊም፡ ቅድመ ጲላጦስ ፈታሂ መስፍነ ይሁዳ ወሮም፡ ኢየሱስ ክርስቶስ ዘትማልም ወዮም፡ ኅበወረደ ወነጠበ ዝናመ አእጋሪከ ደም፡ ለመስቀልከ በሰጊድ ሰላም።", "page": 128, "label": "ለአእጋሪከ"}, {"n": 38, "text": "ሰላም ለስኰናከ እንተ ይስተጋብእ ኩሎ፡ ኅበ ኅደገ ወቀጽዐ ውስተ ሠሌዳ ኰኩሕ ሥዕሎ፡ ኢየሱስ ክርስቶስ ለመልአከ ዓለም ዘትትቤቀሎ፡ ስብሐቲከ እርአይ እግዚኦ እምቅድመ ዓለማት ዘሀሎ፡ መንጦላዕተ ዓይንየ ቅላዕ ወአብርህ ጸዳሎ።", "page": 129, "label": "ለስኰናከ"}, {"n": 39, "text": "ሰላም ለመከየድከ አሐዱ አሐዱ፡ ውስተ ቤተ መቅደስ ለምህሮ እለ ገይሠ ለመዱ፡ ኢየሱስ ክርስቶስ ዘመዓዛ ፍቅርከ ዕቍረ ናርዱ፡ አኅዊክ ስማዕታት ቈላተ ሕማማት ወረዱ፡ ወጻድቃኒከ ገዳማተ ዖዱ።", "page": 129, "label": "ለመከየድከ"}, {"n": 40, "text": "ሰላም ለአፃብዒከ እምጉንደ እልኤ አእጋር፡ እለ አሕመልመላ ደርገ አርአያ አዕፁቅ ዓሥር፡ ኢየሱስ ክርስቶስ ወልደ ኢግዚአብሔር፡ በዘባነ ባሕር ከመ ትትለሃይ ሐመር፡ መንክር ተላህያ በዘለከ ፍቅር።", "page": 130, "label": "ለአፃብዒከ"}, {"n": 41, "text": "ሰላም ለአፅፋረ እግርከ በደመ ቅንዋት እለ ተጠምዓ፡ እስከ ጽዕዳዌሆን ለብሰ ልብሰተ ጠባይዕ ካልአ፡ ኢየሱስ ክርስቶስ ዘተሰቀልከ በአፍአ፡ ከመ እዜኑ ኂሩተከ ወእከዉን ስምዐ፡ መምህረ ረሰይኩከ ረስየኒ ረድአ።", "page": 130, "label": "ለአፅፋረ"}, {"n": 42, "text": "ሰላም ለቆምከ ሐመልማለ ቀይሕ ሥጋ፡ ክርስቶስ ቀዲሜ ጸጋ፤ ናሁ ሰፈነት ወሰፈፈት ኢንበለ ንትጋ፡ ለባሕረ ሣህልከ ዘኢይነጽፍ ፈለጋ፡ ውስተ ሕሊናየ አስተጋብእ አይጋ። ሰላም ለመልክዕከ መልክዐ ክቡር አምላክ፡ እለ ይቴሐታ ሎቱ አሪስተ ሰኰና ወብርክ፡ ኢየሱስ ክርስቶስ ሐዋርያነ መልአክ፡ ይትመላሕ እምሕሊናየ በተግሣፅከ ቡሩክ፡ ኅጠተ ደዌ ዘበቄለ ሦክ።", "page": 131, "label": "ለቆምከ"}, {"n": 43, "text": "ሰላም ለፀኦተ ነፍስከ ኅይለ ሥልጣነ ሞት ዘቀነየ፡ ጽዋዐ ፕሲካ ምሉአ ድኅረ ሠለጥከ ሰትየ፡ ጥዑመ ከናፍር ክርስቶስ እንተ ትነብር ሰደየ፡ በሞት ወበሕይወት አማኅፀንኩ ነፍስየ፡ ውስተ እዴከ ዘገብረ ሰማየ።", "page": 131, "label": "ለፀኦተ"}, {"n": 44, "text": "ሰላም ለበድነ ሥጋከ እመለኮቱ ዘኢተፈልጠ፡ ለሰዓት አሐቲ ከመ ቅጽበተ ዐይን ኅዳጠ፡ መዝገበ ባሕርይ ክርስቶስ ዘኢተአምር ተዉላጠ፡ ኢኮ ዘሐይቅ ጽጌረዳ ወዘባሕር ሰግላጠ፡ ባሕቱ ሃይማኖትየ እሁበከ ሤጠ።", "page": 132, "label": "ለበድነ"}, {"n": 45, "text": "ሰላም ለግንዘተ ሥጋከ በአፈው ወከርቤ ሕውስ፡ ወበልብሰ ገርዜን ንጽሕ ዘኅበሪሆን ፒሦስ፡ መርዓዌ ሥርግወ አመ ትመጽእ ክርስቶስ ዐሥረኒ ለቀበላከ በማኅቶተ ምግባር ውዱስ፡ ከመ ድናግል ጠባባት ዘኁልቆን ኃምስ።", "page": 132, "label": "ለግንዘተ"}, {"n": 46, "text": "ሰላም ለመቃብርከ መካነ ምሥጢር ጎልጎታ፡ ቀዳሚ አዳም ዘኢተቀብረ በዉስቴታ፡ ኢየሱስ ክርስቶስ በረከተ ኤልይስ ዘሰራጵታ፡ ሣህልከ ወምሕረትከ ይመግበኒ በዖታ፡ ከመ ሐገፋ ወሥሙር ወልታ።", "page": 133, "label": "ለመቃብርከ"}, {"n": 47, "text": "ሰላም ለትንሣኤከ እምድኅረ ዕለታት ክልኤ፡ ዐቀብተ መቃብር አፍላፍ እንበለ ይስምዑ ቀርነ ጽዋዔ፡ ወበእንተዝ ይብሉከ ክርስቶስ በኩረ ትንሣኤ፡ ተአመንኩ ቅድመ ገጸ ኩሉ ጉባኤ፡ ኪያከ አበ ወኪያከ ረዳኤ።", "page": 133, "label": "ለትንሣኤከ"}, {"n": 48, "text": "ሰላም ለትንሣኤከ እንተ ተጠየቀ ቦቱ፡ ዜና ትንሣኤሆም በክብር ለቁዱሳን ዘሞቱ፡ ኢየሱስ ክርስቶስ ለዳዊት ቀርነ መንግሥትሱ፡ በዓለ ትንሣኤ ፋሲካነ ዝንቱ፡ እስመ ሥርዓቱ ለእስራኤል ውእቱ።", "page": 134, "label": "ለትንሣኤከ"}, {"n": 49, "text": "ሰላም ለዕርገትከ ዘኢይትረከብ መጠኑ፡ ወለንብረትከ ሰላም ለአቡከ ውስተ የማኑ፡ ኢየሱስ ክርስቶስ እለ ኢያከ ተአመኑ፡ ቅዱሳነ ዘእምኅቤከ ወንጹሐነ ይኩኑ፡ ጰራቅሊጦስሃ መንፈስከ ፈኑ።", "page": 134, "label": "ለዕርገትከ"}, {"n": 50, "text": "ሰላም እብል ለምጽአትከ ከዋላ፡ በደመና ሰማይ ብርህት እንተ ትፀድል እምሥነ ዕብላ፤ አመ ትመጽእ በስብሐት ክርስቶስ ርእሰ መሐላ፡ ጸውዐነ ለአግብርቲከ ውስተ ዐፀደ ፍግዕ ወተድላ፡ ናንሶሱ ምስሌከ በሐዳስ ቀጸላ።", "page": 134, "label": "ሰላም እብል ለምጽአትከ ከዋላ"}, {"n": 51, "text": "እምሥራቀ ፀሐይ እስከነ ዐረብ ይትአኮት ስሙ ለእግዚአብሔር አምላክነ፡ ኪያከ ወልደ ዘፈነወ ለነ፡ ኢየሱስ ክርስቶስ ሊቀ ካህናቲነ፡ አስተጋብአነ ኀበ ትረፍቅ መካነ፡ እስመ ዝርዋን አግብርቲከ ንሕነ።", "page": 135, "label": "እምሥራቀ ፀሐይ"}, {"n": 52, "text": "ሰብሐት ለከ አምላኪየ በኁልቄ ኩሉ ሥዕርትየ፡ ስብሐት ለከ አምላክየ በኁልቄ ኩሉ ዘተርአየ፡ ስብሐት ለከ አምላክየ በኁልቄ ኩሉ ዘኢያስተርአየ፡ ስብሐተ ሥላሴከ ወትረ ይነግር አፍየ።", "page": 135, "label": "ሰብሐት ለከ አምላኪየ"}, {"n": 54, "text": "እምክሉ ይኄይስ በሥላሴከ ተአምኖ፡ ወበወላዲትከ ተማኅፅኖ፡ ኢየሱስ ክርስቶስ እምቤተ መንግሥት ወተክህኖ፡ ተሰብኦተከ እመቦ ዘያስተሐቅር መኒኖ፡ ያንኰርኩር ታሕተ ደይን ግዱፈ ከዊኖ።", "page": 136, "label": "እምኩሉ ይሔይስ"}, {"n": 55, "text": "ሰላም ሰላም ለኩሎን መልክዕከ፡ አምሳለ መልክዑ ለአቡከ፡ ኢየሱስ ክርስቶስ ሕማማተ መስቀል ዘፆርከ፡ ኀብአኒ እምገጸ ሞት በእንተ ማርያም እምኪ፡ አምላኪየ አምላኪየ ኢይጽናዕ ልብከ። አምላከ ምድር ወሰማያት፡ አማላከ ባሕር ወቀላያት፡ ወአምላከ ኩሉ ፍጥረት፡ አምላኮሙ አንተ ለአበው ቀደምት፡ አምላኮሙ ለነቢያት፡ አምላኮሙ ለሐዋርያት፡ አምላከ ጻድቃን ወሰማዕት፡ መሐረነ ለነ አምላክነ እስመ function cover(b,noTitle){const k=COVER[b.id];if(!k)return;view.insertAdjacentHTML('beforeend',`<div class="cover"><img src="${IMG[k]}" alt="${k==='mary'?'ቅድስት ድንግል ማርያም':'ኢየሱስ ክርስቶስ'}">${noTitle?'':`<div class="x">☩</div><h3>${esc(b.title)}</h3>`}</div>`)}
const $=s=>document.querySelector(s), view=$('#view');
let fs=19, stack=[], cur=null;
try{fs=+localStorage.getItem('fs')||19}catch(e){}
const G1=['','፩','፪','፫','፬','፭','፮','፯','፰','፱'],G10=['','፲','፳','፴','፵','፶','፷','፸','፹','፺'];
const geez=n=>n>=100?(Math.floor(n/100)>1?geez(Math.floor(n/100)):'')+'፻'+(n%100?geez(n%100):''):G10[Math.floor(n/10)]+G1[n%10];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const RF=/(ሰ[ኣአ]ሊ ለነ ቅድስት[።፡]*|ወልድኪ ሣህሎ ይክፍለነ[።፡]*)/g;
const today=((new Date().getDay()+6)%7)+1;
function go(fn,title){stack.push([fn,title]);render()}
function render(){const [fn,title]=stack[stack.length-1];if(typeof defaultSearch!=='undefined')$('#srch').onclick=defaultSearch;$('#ttl').textContent=title;$('#back').style.visibility=stack.length>1?'visible':'hidden';$('#nav').hidden=true;$('#tabs').hidden=true;view.innerHTML='';fn();window.scrollTo(0,0)}
$('#back').onclick=()=>{if(stack.length>1){stack.pop();render()}};
$('#fp').onclick=()=>setFs(fs+2);$('#fm').onclick=()=>setFs(fs-2);
function setFs(v){fs=Math.max(14,Math.min(34,v));try{localStorage.setItem('fs',fs)}catch(e){}document.querySelectorAll('.pr').forEach(p=>p.style.fontSize=fs+'px')}
function tile(badge,title,sub,cls,on){const b=document.createElement('button');b.className='tile '+(cls||'');b.innerHTML=`<span class="badge ${badge[1]||''}">${badge[0]}</span><span><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="go">›</span>`;b.onclick=on;view.append(b);return b}
function home(){
  {const C=GeezCal,j=C.today(),e=C.fromJdn(j),feast=C.events(j).some(x=>x.type==='major'||x.type==='feast');
  view.insertAdjacentHTML('beforeend',`<div class="hero"><button class="mezchip" id="mchip" aria-label="Open hymns">♪ መዝሙር</button><button class="datechip" id="dchip" aria-label="Open calendar"><span style="color:var(--gold);display:flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>${C.R.weekdays[C.wd(j)-1]} · ${C.R.months[e.m-1]} ${e.d}, ${e.y}${feast?'<span class="dot"></span>':''}</button><div class="x">☩</div><h2>${DATA.title}</h2><p>${DATA.subtitle}</p></div>`);
  $('#dchip').onclick=()=>go(()=>calendar(0),'ዓውደ ኣዋርሕ');$('#mchip').onclick=()=>go(mezHome,'መዝሙር · Mezmur');}
  const t=DATA.books[1].sections.find(s=>s.weekday===today);
  tile(['✦','gold'],t.title,'ውዳሴ ናይ ሎሚ · Today, '+t.en,'',()=>openSec(DATA.books[1],t));
  view.insertAdjacentHTML('beforeend','<div class="label">መጻሕፍት · BOOKS</div>');
  DATA.books.forEach((b,i)=>tile([geez(i+1)],b.title,b.en+' · '+b.sections.length+(b.sections.length>1?' parts':' part'),'',()=>b.sections.length>1?go(()=>book(b),b.title):openSec(b,b.sections[0])));
  tile(['♪'],'መዝሙር · Mezmur','ያሬዳዊ መዝሙር · '+MEZ.hymns.length+' hymns by feast and season','',()=>go(mezHome,'መዝሙር · Mezmur'));
  tile([`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`],'ዓውደ ኣዋርሕ · Calendar',"Ge'ez calendar, feasts and fasts",'',()=>go(()=>calendar(0),'ዓውደ ኣዋርሕ'));
  tile([geez(DATA.books.length+1)],DATA.numbers.title,"Ge'ez Numerals",'',()=>go(numbers,DATA.numbers.title));
  tile(['ⓘ'],'ብዛዕባ · About','Colophon','',()=>go(aboutView,'ብዛዕባ · About'));
}
function book(b){cover(b);b.sections.forEach((s,i)=>tile([geez(i+1),'solid'],s.title,[s.en,s.items.length>1?s.items.length+' prayers':'',s.weekday===today?'Today':''].filter(Boolean).join(' · '),s.weekday===today?'today':'',()=>openSec(b,s)))}
function openSec(b,s,hi){go(()=>reader(b,b.sections.indexOf(s),hi),b.title)}
function reader(b,i,hi){
  const s=b.sections[i];
  if(b.sections.length===1)cover(b,true);
  view.insertAdjacentHTML('beforeend',`<div class="rh">${esc(s.title)}</div>${s.en?`<div class="en">${esc(s.en)}</div>`:''}${s.intro?`<p class="intro">${esc(s.intro)}</p>`:''}`);
  const lab=s.items.map((it,k)=>[it,k]).filter(([it])=>it.label);
  let chips=null;if(lab.length>1){chips=document.createElement('div');chips.className='chips';view.append(chips)}
  const els=[];
  s.items.forEach((it,k)=>{const p=document.createElement('div');p.className='pr'+(k===hi?' hl':'');p.style.fontSize=fs+'px';
    const t=it.text,at=it.label?t.indexOf(it.label):-1,rf=x=>esc(x).replace(RF,'<span class="rf">$1</span>');
    const txt=at>=0?rf(t.slice(0,at))+`<span class="lb">${esc(it.label)}</span>`+rf(t.slice(at+it.label.length)):rf(t);
    p.innerHTML=(it.label&&at<0?`<span class="lb" style="display:block">${esc(it.label)}</span>`:'')+`<span class="n">${it.n?geez(it.n):'✢'}</span>`+txt;view.append(p);els[k]=p;
    if(k===hi){setTimeout(()=>p.scrollIntoView({block:'center'}),50);setTimeout(()=>p.classList.remove('hl'),2200)}});
  if(chips)lab.forEach(([it,k])=>{const c=document.createElement('button');c.textContent=(it.n?geez(it.n)+' ':'')+it.label;
    c.onclick=()=>{const p=els[k];p.scrollIntoView({block:'start',behavior:'smooth'});p.classList.add('hl');setTimeout(()=>p.classList.remove('hl'),2000)};chips.append(c)});
  view.insertAdjacentHTML('beforeend',`<div class="pg">☩<br>ገጽ ${s.page}</div>`);
  if(b.sections.length>1){$('#nav').hidden=false;$('#pos').textContent=(i+1)+' / '+b.sections.length;
    $('#prev').disabled=i===0;$('#next').disabled=i===b.sections.length-1;
    $('#prev').onclick=()=>{stack[stack.length-1][0]=()=>reader(b,i-1);render()};
    $('#next').onclick=()=>{stack[stack.length-1][0]=()=>reader(b,i+1);render()}}
}
function numbers(){let h='<table>';DATA.numbers.rows.forEach(r=>h+=`<tr><td>${r.geez}</td><td>${esc(r.name)}</td><td>${r.value}</td></tr>`);view.insertAdjacentHTML('beforeend',h+'</table>')}
function search(){
  view.insertAdjacentHTML('beforeend','<label for="q" class="label">ድለ · SEARCH THE GE\'EZ TEXT</label><input id="q" placeholder="e.g. ማርያም ድንግል"><div id="res" style="display:flex;flex-direction:column;gap:8px"></div>');
  const q=$('#q');q.focus();q.oninput=()=>{const v=q.value.trim(),res=$('#res');res.innerHTML='';if(v.length<2)return;let n=0;
    for(const b of DATA.books)for(const s of b.sections)s.items.forEach((it,k)=>{const a=it.text.indexOf(v);if(a<0||n>=100)return;n++;
      const d=document.createElement('div');d.className='hit';const st=Math.max(0,a-30);
      d.innerHTML=`<small>${esc(b.title)} › ${esc(s.title)}</small><div>${st?'…':''}${esc(it.text.slice(st,a+v.length+40))}…</div>`;d.onclick=()=>openSec(b,s,k);res.append(d)});
    if(!n)res.innerHTML='<p class="pg">No results</p>'}
}
